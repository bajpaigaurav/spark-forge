<svg class="fig-svg" viewBox="0 0 760 502" width="100%" role="img" aria-labelledby="fig-title-ef784b4a" aria-describedby="fig-desc-ef784b4a" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-ef784b4a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-ef784b4a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="502" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-ef784b4a">The first token is the only key every query can see</title><desc id="fig-desc-ef784b4a">The causal mask makes column 0 visible to every row: the first token is the one position a head can always attend to when no visible key is a good match. Softmax cannot output &quot;attend to nothing&quot;, so a head with surplus mass can dump it on that token. Xiao et al. (2023) called this the attention sink; remove the first token from the window and perplexity explodes.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">Column 0 is the first token. Under causal masking it is the only key visible to every query, so it is</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">always available as a null key. Softmax must put its mass somewhere; many heads in pretrained models</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">dump surplus mass there. Remove that token from the window and perplexity explodes.</text><rect x="70.00" y="90.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="sink-col"/><rect x="116.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="162.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="208.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="254.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="300.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="346.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="392.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="70.00" y="136.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="sink-col"/><rect x="116.00" y="136.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="causal"/><rect x="162.00" y="136.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="208.00" y="136.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="masked"/><rect x="254.00" y="136.72" width="46.00" height="46.00" rx="0" fill="