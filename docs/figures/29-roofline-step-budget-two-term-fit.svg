<svg class="fig-svg" viewBox="0 0 760 221" width="100%" role="img" aria-labelledby="fig-title-927c2c17" aria-describedby="fig-desc-927c2c17" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-927c2c17" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-927c2c17" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="221" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-927c2c17">The step read: 35 GB shared, 32.77 GB per stream</title><desc id="fig-desc-927c2c17">A read budget rather than a fit. One pass over the weights serves every row, so the weight term is fixed at 35 GB for 70B at four bits; the KV cache is re-read for each stream, so each stream adds 100,000 × 327,680 = 32,768,000,000 bytes at a 100,000-token context. Four streams add 4 × 32,768,000,000 = 131,072,000,000 bytes, so the KV term grows by 3 × 32,768,000,000 = 98,304,000,000 extra bytes per step on top of the 35 GB weight read. Aggregate throughput rises with the row count; per-stream throughput falls, because the read grows faster than the rows it serves.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The weight term does not grow with batch; the KV term does. At one stream the cache is nearly the</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">whole weight read, at four streams it is nearly four times the weight read. Attention arithmetic</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">grows the same way, so the crossover from bandwidth-bound to compute-bound arrives sooner at long</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">context and large batch.</text><text x="16.00" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-weight">shared weight read</text><rect x="188.00" y="111.96" width="97.73" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-weight"/><text x="291.73" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-weight">35 GB</text><text x="16.00" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-kv1">KV read, one stream</text><rect x="188.00" y="145.96" width="91.51" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-kv1"/><text x="285.51" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-kv1">32.77 GB = 100,000 × 327,680 B</text><text x="16.00" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-kv4">KV read, four streams</text><rect x="188.00" y="179.96" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-kv4"/><text x="560.00" y="185.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-kv4">131.07 GB = 4 ×</text><text x="560.00" y="200.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-kv4">32,768,000,000 B</text></svg>