<svg class="fig-svg" viewBox="0 0 760 255" width="100%" role="img" aria-labelledby="fig-title-f9107618" aria-describedby="fig-desc-f9107618" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f9107618" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f9107618" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="255" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f9107618">Where the decode step goes: 10.0 ms shared, 6.9 ms per stream</title><desc id="fig-desc-f9107618">A two-term fit to the measured steps: 16.9 ms at one stream and 37.7 ms at four. If step time is w + B·s, then w + s = 16.9 and w + 4s = 37.7 give 3s = 20.8, s = 6.9 ms and w = 10.0 ms. The shared weight read is 10.0 ms and the unshared per-stream cost is 6.9 ms; four streams add 4 × 6.9 ms of unshared work. The fit is a two-point interpolation, not a law, and its asymptote 1/s ≈ 145 tok/s is an upper bound because s grows with context.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The shared part is about 27% of the four-stream step; at 106.2 aggregate the engine completes 26.6</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">steps per second. Step cost rose 2.2× while work rose four times. KV traffic is the first unshared</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">cost: at 921.6 bytes per position and a 130,659-token mean prompt, one stream&#x27;s cache is 120.4 MB,</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">and four streams add 482 MB per step against a 4.6 GB weight read, roughly a tenth.</text><text x="16.00" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">shared weight read w</text><rect x="188.00" y="111.96" width="97.08" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="291.08" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">10.0 ms</text><text x="16.00" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">per-stream cost s</text><rect x="188.00" y="145.96" width="66.99" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="260.99" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">6.9 ms</text><text x="16.00" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">step at B = 1: w + s</text><rect x="188.00" y="179.96" width="164.07" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="358.07" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">16.9 ms</text><text x="16.00" y="228.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">step at B = 4: w + 4s</text><rect x="188.00" y="213.96" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="228.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">37.7 ms</text></svg>