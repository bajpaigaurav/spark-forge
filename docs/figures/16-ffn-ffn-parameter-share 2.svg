<svg class="fig-svg" viewBox="0 0 760 203" width="100%" role="img" aria-labelledby="fig-title-fac38d8a" aria-describedby="fig-desc-fac38d8a" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-fac38d8a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-fac38d8a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="203" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-fac38d8a">Feed-forward is 57.3 percent of untied parameters</title><desc id="fig-desc-fac38d8a">At d_model = 4,096, L = 32, and V = 128,000, the feed-forward pair holds 4,294,967,296 of the 7,491,026,944 parameters with untied embeddings, a 57.3 percent share. Attention holds 2,147,483,648 and the embeddings 1,048,576,000; tying the embeddings lifts the feed-forward share to 61.7 percent.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">d_model = 4,096, L = 32, V = 128,000. Untied total 7,491,026,944, feed-forward share 57.3%. Tied</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">embeddings halve the embedding term to 524,288,000: total 6,966,738,944, share 61.7%. A gated FFN</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">keeps the same 8L·d_model² by setting m = 8d_model/3, so 3·d_model·m = 8d_model².</text><text x="16.00" y="99.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">feed-forward:</text><text x="16.00" y="115.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">8L·d_model²</text><rect x="188.00" y="93.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">4,294,967,296</text><text x="16.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">attention: 4L·d_model²</text><rect x="188.00" y="127.72" width="183.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="377.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">2,147,483,648</text><text x="16.00" y="167.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">untied embeddings:</text><text x="16.00" y="183.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">2V·d_model</text><rect x="188.00" y="161.72" width="89.36" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="283.36" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">1,048,576,000</text></svg>