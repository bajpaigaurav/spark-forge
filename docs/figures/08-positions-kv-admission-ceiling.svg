<svg class="fig-svg" viewBox="0 0 760 375" width="100%" role="img" aria-labelledby="fig-title-1f6f25e8" aria-describedby="fig-desc-1f6f25e8" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-1f6f25e8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-1f6f25e8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="375" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-1f6f25e8">One reservation, two pool sizes</title><desc id="fig-desc-1f6f25e8">Admission reserves the same 32,786 positions per stream either way: the 32,768-token reply budget plus 16 batch rows plus 2 reserved rows. The equal share of the pool grows with the pool, so the ceiling left for a prompt grows with it. At a quarter pool the share is 65,536 and the ceiling 32,750; at the full window the share is 262,144 and the ceiling 229,358, seven times the first.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">262,144 / 4 = 65,536 and 65,536 − 32,786 = 32,750. 1,048,576 / 4 = 262,144 and 262,144 − 32,786 =</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">229,358, which is 229,358 / 32,750 ≈ seven times the first ceiling. The reservation does not shrink</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">as the pool grows.</text><line x1="16.00" y1="92.72" x2="744.00" y2="92.72" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-262k"/><text x="16.00" y="108.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.248" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="g-262k">pool at 262,144 positions (a quarter of the window)</text><text x="16.00" y="136.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="share-262k">equal share</text><rect x="188.00" y="121.72" width="91.50" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="share-262k"/><text x="287.50" y="136.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="share-262k">65,536</text><text x="16.00" y="162.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-262k">reservation 32,768 +</text><text x="16.00" y="178.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-262k">16 + 2</text><rect x="188.00" y="155.72" width="45.78" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="res-262k"/><text x="241.78" y="170.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-262k">32,786</text><text x="16.00" y="196.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-262k">ceiling left for a</text><text x="16.00" y="212.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-262k">prompt</text><rect x="188.00" y="189.72" width="45.72" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="ceil-262k"/><text x="241.72" y="204.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-262k">32,750</text><line x1="16.00" y1="230.72" x2="744.00" y2="230.72" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-1m"/><text x="16.00" y="246.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.248" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="g-1m">pool at 1,048,576 positions (the full window)</text><text x="16.00" y="274.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="share-1m">equal share</text><rect x="188.00" y="259.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="share-1m"/><text x="562.00" y="274.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="share-1m">262,144</text><text x="16.00" y="300.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-1m">reservation 32,768 +</text><text x="16.00" y="316.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-1m">16 + 2</text><rect x="188.00" y="293.72" width="45.78" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="res-1m"/><text x="241.78" y="308.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="res-1m">32,786</text><text x="16.00" y="334.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-1m">ceiling left for a</text><text x="16.00" y="350.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-1m">prompt</text><rect x="188.00" y="327.72" width="320.22" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="ceil-1m"/><text x="516.22" y="342.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ceil-1m">229,358</text></svg>