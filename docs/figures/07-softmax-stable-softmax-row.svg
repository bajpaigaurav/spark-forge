<svg class="fig-svg" viewBox="0 0 900 301" width="100%" role="img" aria-labelledby="fig-title-672a4ba9" aria-describedby="fig-desc-672a4ba9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-672a4ba9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-672a4ba9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="301" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-672a4ba9">Stable softmax: shift, exponentiate, normalize</title><desc id="fig-desc-672a4ba9">One row of three scores, 2.0, 1.0 and 0.1, passes through the stable softmax. Subtracting the row maximum 2.0 gives 0, −1.0 and −1.9; exponentiating gives 1, 0.368 and 0.150, summing to 1.518; dividing gives 0.659, 0.242 and 0.099, the same shares as the unshifted softmax. The last two columns apply temperature before exponentiating: T = 0.5 concentrates the row to 0.864 on the leader, T = 2 flattens it to 0.502. Those columns and their entropies are illustrative, computed from the chapter&#x27;s scores; the chapter prints the T = 1 shares and H ≈ 0.85 nats.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="max">Row max 2.0; shifted scores 0, −1.0, −1.9; exponentials 1, 0.368, 0.150; sum 1.518; T = 1 shares</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="max">0.659, 0.242, 0.099. The T = 0.5 and T = 2 columns are illustrative, computed by dividing the scores</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="max">by T before exponentiating. Entropy: 0.45, 0.85, 1.03 nats; ceiling ln 3 = 1.10.</text><rect x="94.00" y="124.80" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="scores max"/><rect x="99.00" y="138.20" width="62.00" height="33.60" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2" data-part="scores max"/><text x="130.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="scores max">2</text><rect x="166.00" y="124.80" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="shift max"/><rect x="171.00" y="169.80" width="62.00" height="2.00" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2" data-part="shift max"/><text x="202.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="shift max">0</text><rect x="238.00" y="124.80" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="exp max"/><rect x="243.00" y="155.00" width="62.00" height="16.80" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2" data-part="exp max"/><text x="274.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="exp max">1</text><rect x="310.00" y="124.80" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)"