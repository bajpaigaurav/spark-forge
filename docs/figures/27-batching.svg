<svg class="fig-svg" viewBox="0 0 660 356" width="100%" role="img" aria-label="Static batching versus iteration-level scheduling across decode steps" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Static batching versus iteration-level scheduling across decode steps</title><text x="162.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">first configuration</text><text x="498.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">second configuration</text><rect x="12" y="34" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="47.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Static batch: prompts padded to</text><text x="162.0" y="60.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">longest prompt (up to 130,659</text><text x="162.0" y="73.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">tokens)</text><rect x="12" y="94" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="114.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Static decode: all rows held until</text><text x="162.0" y="127.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">slowest sequence finishes</text><rect x="12" y="154" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="174.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Finished sequence after 607 tokens</text><text x="162.0" y="187.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">still occupies a row and KV cache</text><rect x="12" y="214" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="234.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Continuous scheduler: active</text><text x="162.0" y="247.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">sequence set at each step</text><rect x="12" y="274" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="294.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Select subset fitting memory</text><text x="162.0" y="307.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">budget</text><rect x="348" y="34" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="60.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Run one forward pass</text><rect x="348" y="94" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="114.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Sample one token per sequence and</text><text x="498.0" y="127.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">append</text><rect x="348" y="154" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="174.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Retire on end-of-sequence or</text><text x="498.0" y="187.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">length budget</text><rect x="348" y="214" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="234.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Admit new requests into freed</text><text x="498.0" y="247.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">slots</text><rect x="348" y="274" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="300.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Batch dimension changes every step</text></svg>