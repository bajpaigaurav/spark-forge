<svg class="fig-svg" viewBox="0 0 900 244" width="100%" role="img" aria-labelledby="fig-title-4dd14d08" aria-describedby="fig-desc-4dd14d08" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-4dd14d08" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-4dd14d08" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="244" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-4dd14d08">Static batching holds rows; continuous batching rebuilds them</title><desc id="fig-desc-4dd14d08">It shows the difference the prose describes in sequence: a finished sequence keeps its row and its KV cache until the slowest member finishes, while a continuous scheduler admits a new request into a freed slot at the next step.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The batch dimension changes every step. A request can join at step 40 and leave at 41 while another</text><text x="16.00" y="33.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">holds a slot to step 900.</text><text x="183.67" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 1</text><text x="311.00" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 40</text><text x="438.33" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 41</text><text x="565.67" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 42</text><text x="693.00" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">...</text><text x="820.33" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 900</text><text x="16.00" y="117.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">static batch</text><line x1="16.00" y1="147.20" x2="884.00" y2="147.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">row 1</text><rect x="248.33" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">finished</text><rect x="375.67" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="438.33" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">idle row</text><rect x="503.00" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="565.67" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">idle row</text><rect x="630.33" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="693.00" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">idle</text><rect x="757.67" y="83.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="820.33" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">slowest ends</text><text x="16.00" y="187.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">continuous</text><line x1="16.00" y1="217.20" x2="884.00" y2="217.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="153.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="183.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">row 1</text><rect x="248.33" y="153.20" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="183.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" fo