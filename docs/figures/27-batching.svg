<svg class="fig-svg" viewBox="0 0 660 406" width="100%" role="img" aria-label="Static batching versus iteration-level scheduling across decode steps" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Static batching versus iteration-level scheduling across decode steps</title><text x="162.0" y="19.2" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">first configuration</text><text x="498.0" y="19.2" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">second configuration</text><rect x="12" y="33.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="54.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Static batch: prompts padded to</text><text x="162.0" y="70.70400000000001" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">longest prompt (up to 130,659 tokens)</text><rect x="12" y="103.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="124.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Static decode: all rows held until</text><text x="162.0" y="140.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">slowest sequence finishes</text><rect x="12" y="173.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="194.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Finished sequence after 607 tokens</text><text x="162.0" y="210.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">still occupies a row and KV cache</text><rect x="12" y="243.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="264.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Continuous scheduler: active sequence</text><text x="162.0" y="280.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">set at each step</text><rect x="12" y="313.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="342.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Select subset fitting memory budget</text><rect x="348" y="33.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="62.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Run one forward pass</text><rect x="348" y="103.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="124.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Sample one token per sequence and</text><text x="498.0" y="140.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">append</text><rect x="348" y="173.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="194.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Retire on end-of-sequence or length</text><text x="498.0" y="210.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">budget</text><rect x="348" y="243.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="272.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Admit new requests into freed slots</text><rect x="348" y="313.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="342.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Batch dimension changes every step</text></svg>