<svg class="fig-svg" viewBox="0 0 660 376" width="100%" role="img" aria-label="Static batching versus iteration-level scheduling across decode steps" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Static batching versus iteration-level scheduling across decode steps</title><text x="162.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">first configuration</text><text x="498.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">second configuration</text><rect x="12" y="34" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="56.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Static batch: prompts padded to longest prompt</text><text x="162.0" y="69.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">(up to 130,659 tokens)</text><rect x="12" y="98" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="120.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Static decode: all rows held until slowest</text><text x="162.0" y="133.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">sequence finishes</text><rect x="12" y="162" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="184.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Finished sequence after 607 tokens still</text><text x="162.0" y="197.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">occupies a row and KV cache</text><rect x="12" y="226" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="248.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Continuous scheduler: active sequence set at</text><text x="162.0" y="261.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">each step</text><rect x="12" y="290" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="318.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Select subset fitting memory budget</text><rect x="348" y="34" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="62.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Run one forward pass</text><rect x="348" y="98" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="126.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Sample one token per sequence and append</text><rect x="348" y="162" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="190.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Retire on end-of-sequence or length budget</text><rect x="348" y="226" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="254.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Admit new requests into freed slots</text><rect x="348" y="290" width="300" height="50" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="318.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Batch dimension changes every step</text></svg>