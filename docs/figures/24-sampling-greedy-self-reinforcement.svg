<svg class="fig-svg" viewBox="0 0 900 443" width="100%" role="img" aria-labelledby="fig-title-d3b65948" aria-describedby="fig-desc-d3b65948" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-d3b65948" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-d3b65948" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="443" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-d3b65948">Greedy decoding and the degeneration loop</title><desc id="fig-desc-d3b65948">Greedy decoding takes the argmax, appends it, and runs the model again. When the context ends in &quot;the the&quot;, the scores put &quot;the&quot; above &quot;cat&quot; and &quot;dog&quot;; taking &quot;the&quot; makes the context &quot;the the the&quot;, an even stronger match for the repeated pattern, so &quot;the&quot; rises again. Each step is locally correct and the sequence still loops. The mechanism is self-reinforcement through the KV cache, not a decoding bug.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Holtzman et al. documented this in 2019: maximising likelihood step by step produces text that loops,</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">drifts and contradicts itself. The previous token&#x27;s key and value sit in the cache; if attention puts</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">weight on them and the context supplies no stronger signal, the same direction reaches the head</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">again.</text><text x="196.40" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="context">context</text><text x="349.20" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="scores">score</text><text x="502.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="choice">argmax</text><text x="654.80" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="context">append</text><text x="807.60" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="scores">repeat</text><text x="16.00" y="176.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="context">context</text><line x1="16.00" y1="206.40" x2="884.00" y2="206.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="context"/><rect x="121.00" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="context"/><text x="196.40" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="context">…the the</text><rect x="579.40" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="context"/><text x="654.80" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="context">…the the the</text><rect x="732.20" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="context"/><text x="807.60" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="context">…the the the the</text><text x="16.00" y="246.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="scores">next-token scores</text><line x1="16.00" y1="276.40" x2="884.00" y2="276.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="scores"/><rect x="273.80" y="212.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="scores"/><text x="349.20" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="scores">the on top</text><rect x="732.20" y="212.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="scores"/><text x="807.60" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="scores">the rises again</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="choice">greedy choice</text><line x1="16.00" y1="346.40" x2="884.00" y2="346.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="choice"/><rect x="426.60" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="choice"/><text x="502.00" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="choice">the</text><rect x="579.40" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="choice"/><text x="654.80" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="choice">the</text><rect x="732.20" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="choice"/><text x="807.60" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="choice">the</text><text x="16.00" y="386.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">why</text><line x1="16.00" y1="416.40" x2="884.00" y2="416.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="273.80" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="349.20" y="374.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">pattern seen in</text><text x="349.20" y="392.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">training</text><rect x="579.40" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="654.80" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">stronger match</text><rect x="732.20" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="807.60" y="374.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">self-reinforcemen</text><text x="807.60" y="392.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">t</text></svg>