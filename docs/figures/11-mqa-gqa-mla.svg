<svg class="fig-svg" viewBox="0 0 924 346" width="100%" role="img" aria-label="MHA vs MQA: private versus shared key-value cache" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>MHA vs MQA: private versus shared key-value cache</title><rect x="12" y="12" width="420" height="90" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="48.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">MHA: each of H query heads has its own</text><text x="222.0" y="70.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">key head and value head</text><line x1="222.0" y1="102" x2="222.0" y2="128" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="128" width="420" height="90" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="153.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">MQA: all H query heads read from one</text><text x="222.0" y="175.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">shared key head and one shared value</text><text x="222.0" y="197.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">head</text><line x1="222.0" y1="218" x2="222.0" y2="244" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="244" width="420" height="90" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="280.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">KV cache per token per layer: 16,384</text><text x="222.0" y="302.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">bytes for MHA, 512 bytes for MQA</text><rect x="492" y="12" width="420" height="90" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="37.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">Attention arithmetic intensity: 1</text><text x="702.0" y="59.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">FLOP/byte for MHA, 32 FLOP/byte for</text><text x="702.0" y="81.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">MQA</text><line x1="702.0" y1="102" x2="702.0" y2="128" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="128" width="420" height="90" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="153.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">Ridge point = peak FLOPs / memory</text><text x="702.0" y="175.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">bandwidth; both intensities remain</text><text x="702.0" y="197.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">below it</text><path d="M222.0,289.0 L222.0,360.0 L702.0,360.0 L702.0,57.0" fill="none" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/></svg>