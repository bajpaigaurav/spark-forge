<svg class="fig-svg" viewBox="0 0 484 404" width="100%" role="img" aria-label="MHA vs MQA: private versus shared key-value cache" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>MHA vs MQA: private versus shared key-value cache</title><rect x="12" y="12" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="42.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">MHA: each of H query heads has its own key head and value head</text><line x1="242.0" y1="66" x2="242.0" y2="88" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="88" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="112.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">MQA: all H query heads read from one shared key head and one shared</text><text x="242.0" y="125.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">value head</text><line x1="242.0" y1="142" x2="242.0" y2="164" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="164" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="194.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">KV cache per token per layer: 16,384 bytes for MHA, 512 bytes for MQA</text><line x1="242.0" y1="218" x2="242.0" y2="240" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="240" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="264.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Attention arithmetic intensity: 1 FLOP/byte for MHA, 32 FLOP/byte for</text><text x="242.0" y="277.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">MQA</text><line x1="242.0" y1="294" x2="242.0" y2="316" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="316" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="340.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Ridge point = peak FLOPs / memory bandwidth; both intensities remain</text><text x="242.0" y="353.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">below it</text></svg>