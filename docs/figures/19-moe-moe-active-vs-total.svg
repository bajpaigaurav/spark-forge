<svg class="fig-svg" viewBox="0 0 760 237" width="100%" role="img" aria-labelledby="fig-title-48fdd835" aria-describedby="fig-desc-48fdd835" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-48fdd835" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-48fdd835" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="237" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-48fdd835">Capacity grows with E; per-token compute grows with k</title><desc id="fig-desc-48fdd835">Per token, the dense FFN costs 2 × 4,096 × 14,336 = 117,440,512 multiply-adds; top-2 routing costs 2 × 2 × 4,096 × 14,336 = 234,881,024. The layer holds 64 × 2 × 4,096 × 14,336 = 7,516,192,768 expert parameters, and 128 experts double that to 15,032,385,536. Capacity grows with E; per-token expert compute grows with k.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">d_model = 4,096, d_ff = 14,336, k = 2. Router: 4,096 × 64 = 262,144 multiply-adds, about 0.1% of 235</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">million. Load example: T = 4,096, E = 8, capacity 640; counts 900, 700, 500, 500, 400, 400, 400, 296</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">drop 320 assignments (7.8%), and padding is 1,344 of 5,120 expert rows (26%).</text><text x="16.00" y="99.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-dense">dense FFN:</text><text x="16.00" y="115.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-dense">2·d_model·d_ff</text><rect x="188.00" y="93.72" width="2.86" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-dense"/><text x="196.86" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-dense">117,440,512</text><text x="16.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-active">MoE active: k = 2</text><rect x="188.00" y="127.72" width="5.72" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-active"/><text x="199.72" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-active">234,881,024</text><text x="16.00" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-total64">MoE total: E = 64</text><rect x="188.00" y="161.72" width="183.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-total64"/><text x="377.00" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-total64">7,516,192,768</text><text x="16.00" y="210.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-total128">MoE total: E = 128</text><rect x="188.00" y="195.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-total128"/><text x="560.00" y="210.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-total128">15,032,385,536</text></svg>