<svg class="fig-svg" viewBox="0 0 760 408" width="100%" role="img" aria-labelledby="fig-title-02b734b5" aria-describedby="fig-desc-02b734b5" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-02b734b5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-02b734b5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="408" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-02b734b5">The roofline: a rising bandwidth roof, a flat compute roof, and where each phase sits</title><desc id="fig-desc-02b734b5">It shows the structure the prose builds in sequence: decode at intensity near 1 sits far under the bandwidth roof, prefill at about 130,000 sits under the compute roof, and the ridge where the two meet is about 295 FLOPs per byte on an H100.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Log-log. On an H100 SXM the roofs meet near 295 FLOPs per byte (989 TFLOP/s over 3.35 TB/s), so</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">prefill is compute-bound and decode is bandwidth-bound.</text><line x1="92.00" y1="337.92" x2="732.00" y2="337.92" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="107.92" x2="92.00" y2="337.92" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="107.92" x2="92.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="92.00" y="360.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^0</text><line x1="252.00" y1="107.92" x2="252.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="252.00" y="360.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^1</text><line x1="412.00" y1="107.92" x2="412.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="412.00" y="360.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^2</text><line x1="572.00" y1="107.92" x2="572.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="572.00" y="360.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^3</text><line x1="732.00" y1="107.92" x2="732.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="732.00" y="360.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^4</text><line x1="92.00" y1="337.92" x2="732.00" y2="337.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="342.48" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^0</text><line x1="92.00" y1="261.25" x2="732.00" y2="261.25" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="265.81" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^1</text><line x1="92.00" y1="184.59" x2="732.00" y2="184.59" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="189.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^2</text><line x1="92.00" y1="107.92" x2="732.00" y2="107.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="112.48" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^3</text><text x="412.00" y="392.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">arithmetic intensity, FLOPs per byte</text><text x="29.68" y="222.92" transform="rotate(-90 29.68 222.92)" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">attainable performance</text><polyline points="92.0,337.9 487.2,188.7" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/><line x1="92.00" y1="108.29" x2="732.00" y2="108.29" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/><circle cx="92.00" cy="202.10" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="102.00" y="177.78" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">decode: intensity near 1,</text><text x="102.00" y="192.78" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">59.1 tok/s on this pair</text><circle cx="732.00" cy="119.80" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="722.00" y="95.48" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="end">prefill: intensity near</text><text x="722.00" y="110.48" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="end">130,000, 39,237 tok/s</text><text x="481.17" y="182.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end">bandwidth roof</text><text x="98.00" y="102.29" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start">compute roof: 989 TFLOP/s dense FP16</text></svg>