<svg class="fig-svg" viewBox="0 0 760 169" width="100%" role="img" aria-labelledby="fig-title-a912aabc" aria-describedby="fig-desc-a912aabc" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-a912aabc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-a912aabc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="169" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-a912aabc">Token-level hit rate is the one that tracks prefill work</title><desc id="fig-desc-a912aabc">In the worked example 90 of 110 prompt tokens are cached, a token-level rate of 81.8 percent, while only 1 of 2 requests hits, 50 percent. A request with one cached token counts as a request-level hit but saves almost no compute, which is why the token-level rate is the one that tracks prefill work.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The counters are per prompt token: increment the query counter for every token considered for</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">matching and the hit counter for every reused KV block. Request-level counts a request as a hit even</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">when one token matched.</text><text x="16.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-token">token-level, example</text><rect x="188.00" y="93.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-token"/><text x="560.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-token">81.8%, 90 of 110</text><text x="16.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-request">request-level, example</text><rect x="188.00" y="127.72" width="223.72" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-request"/><text x="417.72" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-request">50%, 1 of 2</text></svg>