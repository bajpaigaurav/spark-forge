<svg class="fig-svg" viewBox="0 0 900 464" width="100%" role="img" aria-labelledby="fig-title-af4e4abc" aria-describedby="fig-desc-af4e4abc" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-af4e4abc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-af4e4abc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="464" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-af4e4abc">Temperature sets the shape; the cut keeps a set</title><desc id="fig-desc-af4e4abc">Temperature rescales logits before the cut; truncation then renormalises. On logits 4.0, 2.0 and 1.0 the T = 1 probabilities are 0.844, 0.114 and 0.042. T = 0.5 sharpens to 0.980 / 0.018 / 0.002; T = 2 flattens to 0.628 / 0.231 / 0.140. Top-k with k = 2 keeps mass 0.958 and renormalises to 0.881 / 0.119; top-p = 0.9 keeps the same two; min-p = 0.1 cuts at 0.0844 and keeps the same two.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The three cuts coincide here because B clears both the cumulative target and the floor. They diverge</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">elsewhere: ten tokens at 0.1 each are kept nine by top-p = 0.9 but five by top-k = 5; one token at</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0.95 with the rest thin is kept alone by top-p but fifty by top-k = 50. Top-p admits a variable count</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">that follows the shape; top-k fixes the count; min-p sets the floor at min_p × p_max = 0.1 × 0.844 =</text><text x="16.00" y="100.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0.0844.</text><text x="183.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">p at T = 1</text><text x="311.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">T = 0.5</text><text x="438.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">T = 2</text><text x="565.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">top-k k = 2</text><text x="693.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">top-p 0.9</text><text x="820.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">min-p 0.1</text><text x="16.00" y="198.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">A: z = 4.0</text><line x1="16.00" y1="228.00" x2="884.00" y2="228.00" 