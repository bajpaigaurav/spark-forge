<svg class="fig-svg" viewBox="0 0 760 481" width="100%" role="img" aria-labelledby="fig-title-8280d65d" aria-describedby="fig-desc-8280d65d" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-8280d65d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-8280d65d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="481" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-8280d65d">Quadratic and linear attention on log-log axes</title><desc id="fig-desc-8280d65d">On log-log axes, quadratic attention rises with slope 2 and linear attention with slope 1. The plotted points run from n = 128 to n = 2048 and are relative costs computed from n/128, an illustrative normalization; the chapter&#x27;s absolute counts at n = 131,072 are in the note. At n = 4096 the quadratic cost is 1024× the n = 128 cost and linear is 32×. The crossover at n = d = 128 is where linear attention becomes cheaper.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Relative cost is illustrative: quadratic attention scales as (n/128)², linear attention as n/128; the</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">crossover is at n = d = 128, which the chapter states. At n = 4096 the quadratic ratio is 1024 and</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the linear ratio is 32. Absolute figures at n = 131,072: 1.718 × 10^10 score entries; 2.199 × 10^12</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">multiply-adds for the scores per head per layer, and the same again for value aggregation, so 4.40 ×</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">10^12; a 4,096-token window cuts entries to 536,870,912, 32× fewer; linear attention costs</text><text x="16.00" y="94.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">2,147,483,648 operations.</text><line x1="92.00" y1="410.88" x2="732.00" y2="410.88" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="180.88" x2="92.00" y2="410.88" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="180.88" x2="92.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="92.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^0</text><line x1="252.00" y1="180.88" x2="252.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="252.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^1</text><line x1="412.00" y1="180.88" x2="412.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="412.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^2</text><line x1="572.00" y1="180.88" x2="572.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="572.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^3</text><line x1="732.00" y1="180.88" x2="732.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="732.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^4</text><line x1="92.00" y1="410.88" x2="732.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^0</text><line x1="92.00" y1="334.21" x2="732.00" y2="334.21" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="338.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^1</text><line x1="92.00" y1="257.55" x2="732.00" y2="257.55" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="262.11" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^2</text><line x1="92.00" y1="180.88" x2="732.00" y2="180.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="185.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^3</text><text x="412.00" y="465.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">sequence length n</text><text x="29.68" y="295.88" transform="rotate(-90 29.68 295.88)" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">cost relative to n = 128</text><g data-part="quadratic"><polyline points="429.2,410.9 477.3,364.7 525.5,318.6 573.6,272.4 621.8,226.2" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/></g><g data-part="linear"><polyline points="429.2,410.9 477.3,387.8 525.5,364.7 573.6,341.6 621.8,318.6" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/></g><circle cx="429.15" cy="410.88" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0" data-part="crossover"/><text x="429.15" y="386.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="crossover">n = d = 128: the curves</text><text x="429.15" y="401.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="crossover">meet</text><text x="615.81" y="220.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end" data-part="quadratic">quadratic: (n/128)²</text><text x="615.81" y="312.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end" data-part="linear">linear: n/128</text></svg>