<svg class="fig-svg" viewBox="0 0 760 237" width="100%" role="img" aria-labelledby="fig-title-6babd107" aria-describedby="fig-desc-6babd107" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-6babd107" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-6babd107" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="237" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-6babd107">Cache bytes grow linearly with positions</title><desc id="fig-desc-6babd107">At 327,680 bytes per position the cache is a straight line in context length: 100,000 positions give 32.77 GB, 131,072 give 42.9 GB, the 262,144-position pool gives 85.9 GB, and a 1,048,576-position window would need 343.6 GB, more than a 192 GB H100 holds. Bar values are those multiplications, not separately measured sizes.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">327,680 bytes per position: 2 x 80 layers x 8 KV heads x 128 dimensions x 2 bytes. The pool holds</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">262,144 positions in four 65,536-position shares; the last bar is a hypothetical 1,048,576-position</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">window, which at the same 327,680 bytes per position would be 1,048,576 × 327,680 = 343.6 GB.</text><text x="16.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">100,000 prompt</text><rect x="188.00" y="93.72" width="34.91" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="228.91" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">32.77 GB = 100,000 x 327,680 B</text><text x="16.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">131,072 context</text><rect x="188.00" y="127.72" width="45.70" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="239.70" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">42.9 GB = 131,072 x 327,680 B</text><text x="16.00" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">262,144 pool</text><rect x="188.00" y="161.72" width="91.50" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="285.50" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">85.9 GB = 262,144 x 327,680 B</text><text x="16.00" y="210.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">1,048,576 window</text><rect x="188.00" y="195.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="201.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">343.6 GB, more than 192 GB</text><text x="560.00" y="216.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">of HBM</text></svg>