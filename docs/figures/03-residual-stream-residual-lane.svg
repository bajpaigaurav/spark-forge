<svg class="fig-svg" viewBox="0 0 900 297" width="100%" role="img" aria-labelledby="fig-title-5c733832" aria-describedby="fig-desc-5c733832" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-5c733832" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-5c733832" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="297" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-5c733832">One lane, read and written at every block</title><desc id="fig-desc-5c733832">Every sublayer reads the residual stream, computes a correction, and adds it back. The lane holds one vector per token at width d_model from the embedding lookup to the unembedding; attention and the feed-forward network never replace it, so nothing else survives the depth.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">Attention is the only sublayer that moves information between positions; everything else is</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">per-token. Deleting a layer at inference still leaves the lane intact.</text><g data-part="lane"><rect x="132.00" y="169.20" width="752.00" height="25.31" rx="12.654" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.4"/><text x="148.00" y="186.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">the residual stream: one vector per token, width d_model, never replaced</text></g><text x="76.00" y="108.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row-enc">encoder layer</text><text x="76.00" y="126.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row-enc">two writes per layer</text><g data-part="enc-attn"><rect x="274.33" y="91.20" width="230.67" height="50.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.2"/><text x="389.67" y="108.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">self-attention</text><text x="389.67" y="126.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">reads every position</text></g><line x1="348.15" y1="169.20" x2="348.15" y2="141.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-5c733832)" data-part="enc-attn"/><line x1="431.19" y1="141.20" x2="431.19" y2="169.20" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" marker-end="url(#arrow-accent-5c733832)" data-part="enc-attn"/><g data-part="enc-ff"><rect x="527.00" y="91.20" width="230.67" height="50.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.2"/><text x="642.33" y="108.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">feed-forward</text><text x="642.33" y="126.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">per token</text></g><line x1="600.81" y1="169.20" x2="600.81" y2="141.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-5c733832)" data-part="enc-ff"/><line x1="683.85" y1="141.20" x2="683.85" y2="169.20" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" marker-end="url(#arrow-accent-5c733832)" data-part="enc-ff"/><text x="76.00" y="240.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row-dec">decoder layer</text><text x="76.00" y="258.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row-dec">three writes per layer</text><g data-part="dec-mask"><rect x="148.00" y="222.51" width="230.67" height="50.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.2"/><text x="263.33" y="240.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">masked self-attention</text><text x="263.33" y="258.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">reads past positions</text></g><line x1="221.81" y1="194.51" x2="221.81" y2="222.51" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-5c733832)" data-part="dec-mask"/><line x1="304.85" y1="222.51" x2="304.85" y2="194.51" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" marker-end="url(#arrow-accent-5c733832)" data-part="dec-mask"/><g data-part="dec-cross"><rect x="400.67" y="222.51" width="230.67" height="50.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.2"/><text x="516.00" y="240.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">cross-attention</text><text x="516.00" y="258.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">reads the encoder</text></g><line x1="474.48" y1="194.51" x2="474.48" y2="222.51" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-5c733832)" data-part="dec-cross"/><line x1="557.52" y1="222.51" x2="557.52" y2="194.51" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" marker-end="url(#arrow-accent-5c733832)" data-part="dec-cross"/><g data-part="dec-ff"><rect x="653.33" y="222.51" width="230.67" height="50.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.2"/><text x="768.67" y="240.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">feed-forward</text><text x="768.67" y="258.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">per token</text></g><line x1="727.15" y1="194.51" x2="727.15" y2="222.51" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-5c733832)" data-part="dec-ff"/><line x1="810.19" y1="222.51" x2="810.19" y2="194.51" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" marker-end="url(#arrow-accent-5c733832)" data-part="dec-ff"/></svg>