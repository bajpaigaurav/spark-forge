<svg class="fig-svg" viewBox="0 0 900 261" width="100%" role="img" aria-labelledby="fig-title-5c733832" aria-describedby="fig-desc-5c733832" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-5c733832" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-5c733832" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="261" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-5c733832">One lane, read and written at every block</title><desc id="fig-desc-5c733832">Every sublayer reads the residual stream, computes a correction, and adds it back. The lane holds one vector per token at width d_model from the embedding lookup to the unembedding; attention and the feed-forward network never replace it, so nothing else survives the depth.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Attention is the only stage that moves information between positions; every other stage is per-token.</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Encoder layers write to the stream twice, decoder layers three times.</text><text x="16.00" y="105.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="residual">residual stream: width d_model, never replaced</text><path d="M16,113.19999999999999 L884,113.19999999999999" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-5c733832)" data-part="residual"/><rect x="16.00" y="145.20" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="embedding"/><text x="92.40" y="174.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="embedding">embedding</text><text x="92.40" y="223.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="embedding">d_model</text><rect x="194.80" y="145.20" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="attention"/><text x="271.20" y="174.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="attention">attention</text><text x="271.20" y="223.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="attention">d_model</text><rect x="373.60" y="145.20" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="feed-forward"/><text x="450.00" y="174.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="feed-forward">feed-forward</text><text x="450.00" y="223.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="feed-forward">d_model</text><rect x="552.40" y="145.20" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="final-norm"/><text x="628.80" y="174.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="final-norm">final norm</text><text x="628.80" y="223.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="final-norm">d_model</text><rect x="731.20" y="145.20" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="unembedding"/><text x="807.60" y="174.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="unembedding">unembedding</text><text x="807.60" y="223.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="unembedding">V</text><path d="M884,113.19999999999999 L884,139.2" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-5c733832)" data-part="residual"/></svg>