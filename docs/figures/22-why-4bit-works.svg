<svg class="fig-svg" viewBox="0 0 660 236" width="100%" role="img" aria-label="Quantization error in a dot product: aligned vs independent" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Quantization error in a dot product: aligned vs independent</title><text x="162.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">first configuration</text><text x="498.0" y="20" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="12" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">second configuration</text><rect x="12" y="34" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="60.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">N = 4,096 terms</text><rect x="12" y="94" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="120.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">per-term bound = 0.067 × 0.5 = 0.0335</text><rect x="12" y="154" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="180.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">aligned total = 4,096 × 0.0335 = 137.2</text><rect x="348" y="34" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="60.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">independent std = sqrt(4,096) × 0.0335 = 2.14</text><rect x="348" y="94" width="300" height="46" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="498.0" y="120.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">ratio = 64 = sqrt(N)</text></svg>