<svg class="fig-svg" viewBox="0 0 900 246" width="100%" role="img" aria-labelledby="fig-title-2a8876f5" aria-describedby="fig-desc-2a8876f5" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-2a8876f5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-2a8876f5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="246" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-2a8876f5">Each stream&#x27;s share: 32,768 + 16 + 2 reserved, 32,750 usable</title><desc id="fig-desc-2a8876f5">The 262,144-position KV pool split across four streams gives each 65,536 positions. Admission reserves the 32,768-token reply budget, rounds the batch width up to the 16-row kernel granularity and adds 2 slack positions: 32,768 + 16 + 2. That leaves 65,536 − (32,768 + 16 + 2) = 32,750 positions as the prompt ceiling a request sees. The reservation is a worst-case rule, and the measured traffic averages 607 generated tokens against a 32,768-token reservation.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">262,144 ÷ 4 = 65,536; 65,536 − 32,768 − 16 − 2 = 32,750. Idle slots do not hold their reservation,</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">which is why a single 130,659-token prompt fits. At the native 1,048,576 window the pool is 262,144</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">per rank, and 1,048,576 ÷ 16 = 65,536, minus 32,768, minus 16, minus 2 = 32,750 again.</text><rect x="16.00" y="120.80" width="868.00" height="46.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.4"/><rect x="16.00" y="120.80" width="108.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="70.28" y="188.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">32,768 + 16 + 2</text><rect x="124.56" y="120.80" width="108.44" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="178.78" y="149.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">32,750</text><rect x="233.00" y="120.80" width="108.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="287.28" y="188.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">32,768 + 16 + 2</text><rect x="341.56" y="120.80" width="108.44" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="395.78" y="149.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">32,750</text><rect x="450.00" y="120.80" width="108.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="504.28" y="188.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">32,768 + 16 + 2</text><rect x="558.56" y="120.80" width="108.44" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="612.78" y="149.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">32,750</text><rect x="667.00" y="120.80" width="108.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="721.28" y="188.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">32,768 + 16 + 2</text><rect x="775.56" y="120.80" width="108.44" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="829.78" y="149.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">32,750</text><line x1="16.00" y1="199.20" x2="884.00" y2="199.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="16.00" y1="195.20" x2="16.00" y2="203.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="16.00" y="219.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0</text><line x1="884.00" y1="195.20" x2="884.00" y2="203.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="884.00" y="219.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">262,144</text></svg>