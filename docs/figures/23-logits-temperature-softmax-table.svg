<svg class="fig-svg" viewBox="0 0 900 301" width="100%" role="img" aria-labelledby="fig-title-e43fb219" aria-describedby="fig-desc-e43fb219" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-e43fb219" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-e43fb219" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="301" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-e43fb219">Temperature reshapes the same three logits</title><desc id="fig-desc-e43fb219">Temperature divides every logit before softmax and leaves the order unchanged. On the same logits 2, 1 and 0, T = 0.5 sharpens the distribution to 0.867 / 0.117 / 0.016, T = 1 gives 0.665 / 0.245 / 0.090, and T = 2 flattens it to 0.506 / 0.307 / 0.186. Row 1 is T = 1. Each cell is a probability, inked in proportion to its value.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">At T = 0.5 the scaled logits are 4, 2 and 0, with exponentials 54.598, 7.389 and 1 summing to 62.987.</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">At T = 2 they are 1, 0.5 and 0, with 2.718, 1.649 and 1 summing to 5.367. Temperature can only</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">reweight what the head already produced; it cannot recover a candidate scored far below the top.</text><rect x="94.00" y="124.80" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8"/><text x="130.00" y="157.10" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">T = 0.5</text><rect x="166.00" y="124.80" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8"/><rect x="171.00" y="135.39" width="62.00" height="36.41" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2"/><text x="202.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.867</text><rect x="238.00" y="124.80" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8"/><rect x="243.00" y="166.89" width="62.00" height="4.91" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2"/><text x="274.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.117</text><rect x="310.00" y="124.80" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8"/><rect x="315.00" y="169.80" width="62.00" height="2.00" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2"/><text x="346.00" y="136.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.016</text><rect x="94.00" y="176.80" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="130.00" y="209.10" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" 