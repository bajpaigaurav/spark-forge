<svg class="fig-svg" viewBox="0 0 480 334" width="100%" role="img" aria-labelledby="fig-title-eb56da77" aria-describedby="fig-desc-eb56da77" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-eb56da77" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-eb56da77" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="480" height="334" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-eb56da77">One merge forest, three words</title><desc id="fig-desc-eb56da77">A graph with the characters l, o, w, e, r, s, t and two end-of-word markers along the bottom. Lines rise from l and o to a node labelled lo, then from lo and w to low. From low, one branch joins an end-of-word marker to make the token low, and another joins e to make lowe. lowe and r make lower, and lower and a second end-of-word marker make the finished token lower. The characters s and t have no parent, so lowest stops at lowe. Each merge node carries the rank that fired beneath it.</desc><line x1="34.98" y1="252.92" x2="49.95" y2="206.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lo"/><line x1="64.93" y1="252.92" x2="49.95" y2="206.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lo"/><line x1="49.95" y1="206.92" x2="72.42" y2="160.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low"/><line x1="94.88" y1="252.92" x2="72.42" y2="160.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low"/><line x1="72.42" y1="160.92" x2="162.99" y2="114.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low-end"/><line x1="253.57" y1="252.92" x2="162.99" y2="114.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low-end"/><line x1="72.42" y1="160.92" x2="98.62" y2="114.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low-e"/><line x1="124.83" y1="252.92" x2="98.62" y2="114.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="low-e"/><line x1="98.62" y1="114.92" x2="126.70" y2="68.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lower"/><line x1="154.78" y1="252.92" x2="126.70" y2="68.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lower"/><line x1="126.70" y1="68.92" x2="214.04" y2="22.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lower-end"/><line x1="301.38" y1="252.92" x2="214.04" y2="22.92" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.4" data-part="lower-end"/><circle cx="34.98" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="34.98" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">l</text><circle cx="64.93" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="64.93" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">o</text><circle cx="94.88" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="94.88" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">w</text><circle cx="124.83" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="124.83" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">e</text><circle cx="154.78" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="154.78" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">r</text><circle cx="184.74" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="184.74" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">s</text><circle cx="214.69" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="214.69" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">t</text><circle cx="253.57" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="253.57" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">&lt;/w&gt;</text><circle cx="301.38" cy="252.92" r="3.60" fill="var(--color-muted, #5a6070)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="base"/><text x="301.38" y="268.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="base">&lt;/w&gt;</text><circle cx="49.95" cy="206.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="lo"/><text x="49.95" y="195.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="lo">lo</text><text x="49.95" y="223.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="lo">r0</text><circle cx="72.42" cy="160.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="low"/><text x="72.42" y="149.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="low">low</text><text x="72.42" y="177.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="low">r1</text><circle cx="162.99" cy="114.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="low-end"/><text x="162.99" y="103.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="low-end">low&lt;/w&gt;</text><text x="162.99" y="131.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="low-end">r2</text><circle cx="98.62" cy="114.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="low-e"/><text x="98.62" y="103.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="low-e">lowe</text><text x="98.62" y="131.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="low-e">r3</text><circle cx="126.70" cy="68.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="lower"/><text x="126.70" y="57.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="lower">lower</text><text x="126.70" y="85.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="lower">r4</text><circle cx="214.04" cy="22.92" r="6.40" fill="var(--color-accent, #8a3324)" stroke="var(--color-sheet, #f2f1ed)" stroke-width="1.6" data-part="lower-end"/><text x="214.04" y="11.52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9.6" font-weight="500" fill="var(--color-ink, #1a1d24)" text-anchor="middle" class="mono" data-part="lower-end">lower&lt;/w&gt;</text><text x="214.04" y="39.40" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="7.4879999999999995" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" class="mono" data-part="lower-end">r5</text><text x="28.00" y="284.84" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="7.871999999999999" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Read bottom to top. Each node is one merge and its two children are the pieces it was built from;</text><text x="28.00" y="296.84" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="7.871999999999999" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the badge under a node is the rank that fired. The lo then low spine is shared, so lower never</text><text x="28.00" y="308.84" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="7.871999999999999" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">rebuilds it. lowest stops at lowe and leaves its s, t and end-of-word marker as raw bytes.</text></svg>