<svg class="fig-svg" viewBox="0 0 660 266" width="100%" role="img" aria-label="Sinusoidal vs learned positional encoding" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Sinusoidal vs learned positional encoding</title><text x="162.0" y="19.2" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">first configuration</text><text x="498.0" y="19.2" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="600" fill="var(--accent, #b4532a)" text-anchor="middle">second configuration</text><rect x="12" y="33.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="54.704" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Sinusoidal encoding (Vaswani et al.,</text><text x="162.0" y="70.70400000000001" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">2017)</text><rect x="12" y="103.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="132.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Learned lookup table (BERT, GPT-2)</text><rect x="12" y="173.2" width="300" height="56" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="162.0" y="202.70399999999998" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="13.2" font-weight="400" fill="var(--ink)" text-anchor="middle">Geometric wavelength ladder</text><rect x="348" y="33.2" width