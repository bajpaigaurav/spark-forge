<svg class="fig-svg" viewBox="0 0 760 481" width="100%" role="img" aria-labelledby="fig-title-9b0e3cb0" aria-describedby="fig-desc-9b0e3cb0" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-9b0e3cb0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-9b0e3cb0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="481" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-9b0e3cb0">Why divide by sqrt(d_k)</title><desc id="fig-desc-9b0e3cb0">Score standard deviation against d_k under the paper&#x27;s unit-variance assumption: the raw curve is sqrt(d_k), and the horizontal line is the scaled result, standard deviation 1. At d_k = 64 the raw standard deviation is 8, so a two-sigma gap between the top two scores gives an exponential ratio of about 8.9 million; dividing by sqrt(d_k) shrinks the gap by 8. The curve is computed from sqrt(d_k), not measured, and the gradient collapse lives in the note because it sits below the plot&#x27;s range.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Under the assumption each product q_a k_a has variance 1, and the sum of d_k products has variance</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">d_k, so the raw score standard deviation is sqrt(d_k). At d_k = 64 that is 8: a two-sigma gap gives</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">an exponential ratio of e^16 ≈ 8.9 million, the top share is about 1 − e^−16, and its gradient a(1 −</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">a) is about 1e−7. At a = 0.999 the gradient is 0.000999; at a = 0.665 it is 0.665 × 0.335 = 0.223,</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">more than two hundred times larger. Dividing by sqrt(d_k) restores standard deviation 1 and shrinks</text><text x="16.00" y="94.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the gap by 8.</text><line x1="92.00" y1="410.88" x2="732.00" y2="410.88" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="180.88" x2="92.00" y2="410.88" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="180.88" x2="92.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="92.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^0</text><line x1="252.00" y1="180.88" x2="252.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="252.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^1</text><line x1="412.00" y1="180.88" x2="412.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="412.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^2</text><line x1="572.00" y1="180.88" x2="572.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="572.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^3</text><line x1="732.00" y1="180.88" x2="732.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="732.00" y="433.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^4</text><line x1="92.00" y1="410.88" x2="732.00" y2="410.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^0</text><line x1="92.00" y1="334.21" x2="732.00" y2="334.21" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="338.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^1</text><line x1="92.00" y1="257.55" x2="732.00" y2="257.55" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="262.11" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^2</text><line x1="92.00" y1="180.88" x2="732.00" y2="180.88" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="185.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^3</text><text x="412.00" y="465.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_k (log scale)</text><text x="29.68" y="295.88" transform="rotate(-90 29.68 295.88)" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">score standard deviation</text><g data-part="std-curve"><polyline points="92.0,410.9 188.3,387.8 284.7,364.7 381.0,341.6 477.3,318.6 573.6,295.5 670.0,272.4" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/></g><line x1="92.00" y1="410.88" x2="732.00" y2="410.88" stroke="var(--color-accent, #8a3324)" stroke-width="2.2" data-part="std-one"/><circle cx="380.99" cy="341.64" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0" data-part="dk-64"/><text x="380.99" y="317.32" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="dk-64">d_k = 64 → std 8</text><text x="663.98" y="266.41" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end" data-part="std-curve">std = sqrt(d_k)</text><text x="98.00" y="404.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="std-one">after ÷ sqrt(d_k): std = 1</text></svg>