<svg class="fig-svg" viewBox="0 0 760 445" width="100%" role="img" aria-labelledby="fig-title-4030a9b8" aria-describedby="fig-desc-4030a9b8" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-4030a9b8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-4030a9b8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="445" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-4030a9b8">Why divide by sqrt(d_k)</title><desc id="fig-desc-4030a9b8">Score standard deviation against d_k under the paper&#x27;s unit-variance assumption: the raw curve is sqrt(d_k), and the horizontal line is the scaled result, standard deviation 1. At d_k = 64 the raw standard deviation is 8, so a two-sigma gap between the top two scores gives an exponential ratio of about 8.9 million; dividing by sqrt(d_k) shrinks the gap by 8. The curve is computed from sqrt(d_k), not measured.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Under the assumption each product q_a k_a has variance 1, and the sum of d_k products has variance</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">d_k, so the raw score standard deviation is sqrt(d_k). A gap of two standard deviations gives e^16 ≈</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">8.9 million; at a = 0.999 the softmax gradient is 0.000999, against 0.223 in the unsaturated example.</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Dividing by sqrt(d_k) restores standard deviation 1.</text><line x1="92.00" y1="374.40" x2="732.00" y2="374.40" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="144.40" x2="92.00" y2="374.40" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="144.40" x2="92.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="92.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^0</text><line x1="252.00" y1="144.40" x2="252.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="252.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^1</text><line x1="412.00" y1="144.40" x2="412.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="412.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^2</text><line x1="572.00" y1="144.40" x2="572.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="572.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^3</text><line x1="732.00" y1="144.40" x2="732.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="732.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^4</text><line x1="92.00" y1="374.40" x2="732.00" y2="374.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="378.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^0</text><line x1="92.00" y1="297.73" x2="732.00" y2="297.73" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="302.29" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^1</text><line x1="92.00" y1="221.07" x2="732.00" y2="221.07" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="225.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^2</text><line x1="92.00" y1="144.40" x2="732.00" y2="144.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="148.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^3</text><text x="412.00" y="429.12" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_k (log scale)</text><text x="29.68" y="259.40" transform="rotate(-90 29.68 259.40)" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">score standard deviation</text><polyline points="92.0,374.4 188.3,351.3 284.7,328.2 381.0,305.2 477.3,282.1 573.6,259.0 670.0,235.9" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/><line x1="92.00" y1="374.40" x2="732.00" y2="374.40" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/><circle cx="380.99" cy="305.16" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="380.99" y="280.84" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_k = 64 → std 8</text><text x="663.98" y="229.93" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end">std = sqrt(d_k)</text><text x="98.00" y="368.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start">after ÷ sqrt(d_k): std = 1</text></svg>