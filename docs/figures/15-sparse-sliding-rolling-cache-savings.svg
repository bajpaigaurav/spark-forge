<svg class="fig-svg" viewBox="0 0 760 185" width="100%" role="img" aria-labelledby="fig-title-b2db812a" aria-describedby="fig-desc-b2db812a" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-b2db812a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-b2db812a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="185" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-b2db812a">A rolling cache holds W positions, not the whole context</title><desc id="fig-desc-b2db812a">Mistral 7B&#x27;s cache costs 128 KiB per token: 32 layers x 8 KV heads x 128 dimensions x 2 for K and V x 2 bytes. A 4,096-token window needs 512 MiB per stream, where holding 65,536 positions would need 8 GiB and a full 131,072-token prompt 16 GiB. The last two bars are 128 KiB multiplied by the position count, not separately measured sizes.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">128 KiB per token = 32 layers x 8 KV heads x 128 x 2 (K/V) x 2 bytes. The rolling buffer writes token</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">i to slot i mod W; position ids stay absolute so the mask still knows the true distance.</text><text x="16.00" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-window">window W = 4,096</text><rect x="188.00" y="75.48" width="11.44" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-window"/><text x="205.44" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-window">512 MiB per stream</text><text x="16.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-65536">full, 65,536</text><rect x="188.00" y="109.48" width="183.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-65536"/><text x="377.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-65536">8 GiB = 65,536 x 128 KiB</text><text x="16.00" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-131072">full, 131,072</text><rect x="188.00" y="143.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-131072"/><text x="560.00" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-131072">16 GiB = 131,072 x 128 KiB</text></svg>