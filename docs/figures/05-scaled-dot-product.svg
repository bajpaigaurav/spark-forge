<svg class="fig-svg" viewBox="0 0 834 274" width="100%" role="img" aria-label="One transformer layer: residual stream, Q/K/V projections, norm, and feed-forward" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>One transformer layer: residual stream, Q/K/V projections, norm, and feed-forward</title><rect x="12" y="16" width="168" height="76" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="96.0" y="51.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">x: residual stream</text><text x="96.0" y="64.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">vector, length d_model</text><line x1="180" y1="54.0" x2="226" y2="54.0" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="226" y="16" width="168" height="76" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="310.0" y="51.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">W_Q, W_K, W_V: each</text><text x="310.0" y="64.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">d_model by d_k</text><line x1="394" y1="54.0" x2="440" y2="54.0" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="440" y="16" width="168" height="76" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="524.0" y="51.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">q = x W_Q, k = x W_K, v</text><text x="524.0" y="6