<svg class="fig-svg" viewBox="0 0 900 304" width="100%" role="img" aria-labelledby="fig-title-17d9d993" aria-describedby="fig-desc-17d9d993" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-17d9d993" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-17d9d993" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="304" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-17d9d993">Two projections, one gate, one product</title><desc id="fig-desc-17d9d993">A gated linear unit splits the up-projection into a gate matrix W_g and a value matrix W_v, applies Swish to the gate, and multiplies the two elementwise before the down-projection. Holding the parameter budget at 8d_model² requires m = 8d_model/3, about 2.67d_model, so the scratch space is two-thirds as wide as the plain four-times FFN.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Holding 8d_model²: 3·d_model·m = 8d_model² gives m = 8d_model/3 = 10,922.67 at d_model = 4,096; LLaMA</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">rounds to 11,008, a multiple of 256; the exact width is about 2.67d_model. Linear multiply-adds stay</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">at 8d_model², the gate adds a sigmoid and an elementwise multiply per element, and the scratch width</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">falls from 4d_model to 8d_model/3.</text><text x="16.00" y="148.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start">residual stream: x</text><path d="M16,156.39999999999998 L884,156.39999999999998" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-17d9d993)"/><rect x="16.00" y="188.40" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="92.40" y="206.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">x, width</text><text x="92.40" y="228.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_model</text><text x="92.40" y="266.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">d_model = 4,096</text><rect x="194.80" y="188.40" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="271.20" y="206.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">W_g, W_v:</text><text x="271.20" y="228.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_model × m</text><text x="271.20" y="258.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">m = 8d_model/3 =</text><text x="271.20" y="275.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10,922.67</text><rect x="373.60" y="188.40" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="450.00" y="206.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">Swish(gate) ⊗</text><text x="450.00" y="228.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">value</text><text x="450.00" y="266.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">per element</text><rect x="552.40" y="188.40" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="628.80" y="206.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">W_d: m ×</text><text x="628.80" y="228.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">d_model</text><text x="628.80" y="258.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">total: 3·d_model·m</text><text x="628.80" y="275.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">= 8d_model²</text><rect x="731.20" y="188.40" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="807.60" y="217.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">add to x</text><text x="807.60" y="266.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">residual</text><path d="M884,156.39999999999998 L884,182.39999999999998" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-17d9d993)"/></svg>