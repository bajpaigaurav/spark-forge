<svg class="fig-svg" viewBox="0 0 900 239" width="100%" role="img" aria-labelledby="fig-title-8b8ce4c9" aria-describedby="fig-desc-8b8ce4c9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-8b8ce4c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-8b8ce4c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="239" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-8b8ce4c9">Tying saves a second copy of the embedding matrix</title><desc id="fig-desc-8b8ce4c9">Tying sets W = Eᵀ, so one V × d_model matrix serves both the input lookup and the output projection. GPT-2 small publishes 124M parameters with the matrix counted once; untied, the same model carries a second 38,597,376-number copy, about 163M, so tying saves roughly 24 percent of the untied count.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">50,257 × 768 = 38,597,376 numbers, stored once. Untying stores a second copy: 124M + 38.6M ≈ 163M.</text><text x="16.00" y="83.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="bypass">W = Eᵀ: the output projection is the same matrix, read the other way</text><path d="M16,91.6 L884,91.6" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-8b8ce4c9)" data-part="bypass"/><rect x="16.00" y="123.60" width="197.50" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="stage-token"/><text x="114.75" y="152.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="stage-token">token id</text><text x="114.75" y="201.87" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="stage-token">one integer</text><rect x="239.50" y="123.60" width="197.50" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="stage-gather"/><text x="338.25" y="152.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="stage-gather">gather row k of E</text><text x="338.25" y="201.87" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="stage-gather">row, width 768</text><rect x="463.00" y="123.60" width="197.50" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="stage-h"/><text x="561.75" y="152.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="stage-h">h, width d</text><text x="561.75" y="201.87" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="stage-h">residual stream</text><rect x="686.50" y="123.60" width="197.50" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="stage-logits"/><text x="785.25" y="152.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="stage-logits">logits: h Eᵀ</text><text x="785.25" y="201.87" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="stage-logits">one score per token</text><path d="M884,91.6 L884,117.6" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-8b8ce4c9)" data-part="bypass"/></svg>