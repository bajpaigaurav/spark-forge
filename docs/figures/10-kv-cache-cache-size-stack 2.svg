<svg class="fig-svg" viewBox="0 0 900 406" width="100%" role="img" aria-labelledby="fig-title-68fad916" aria-describedby="fig-desc-68fad916" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-68fad916" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-68fad916" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="406" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-68fad916">The cache bill as a product across three scales</title><desc id="fig-desc-68fad916">The cache bill multiplies across scales. Llama 2 70B keeps 163,840 key and value numbers per position across 80 layers, which at two bytes each is 327,680 bytes per position. A 100,000-token prompt needs 100,000 x 327,680 bytes = 32.77 GB, and 131,072 positions need 42.9 GB, most of what a 192 GB H100 has left after 140 GB of FP16 weights. Four concurrent 100,000-token streams would need 4 x 32.77 GB = 131.1 GB, more than the card has spare.</desc><text x="16.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="pos">One position, all layers</text><line x1="16.00" y1="51.20" x2="286.67" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="pos"/><rect x="16.00" y="61.20" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="v-layer"/><text x="151.33" y="79.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-layer">8 KV heads x 128 dimensions =</text><text x="151.33" y="98.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-layer">1,024 values per layer</text><rect x="16.00" y="122.40" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="v-position"/><text x="151.33" y="141.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-position">2 x 80 x 1,024 = 163,840</text><text x="151.33" y="160.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-position">values per position</text><rect x="16.00" y="183.60" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="v-bytes"/><text x="151.33" y="202.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-bytes">163,840 x 2 bytes = 327,680</text><text x="151.33" y="221.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="v-bytes">bytes per position</text><text x="16.00" y="262.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="pos">The query vector is not cached;</text><text x="16.00" y="280.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="pos">only keys and values are. At a</text><text x="16.00" y="298.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="pos">third of a megabyte per position,</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="pos">context length is the whole bill.</text><text x="314.67" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="req">One request on one card</text><line x1="314.67" y1="51.20" x2="585.33" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="req"/><rect x="314.67" y="61.20" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="bytes-100k"/><text x="450.00" y="79.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="bytes-100k">100,000 positions x 327,680</text><text x="450.00" y="98.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="bytes-100k">bytes = 32.77 GB</text><rect x="314.67" y="122.40" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="bytes-131k"/><text x="450.00" y="141.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="bytes-131k">131,072 positions x 327,680</text><text x="450.00" y="160.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="bytes-131k">bytes = 42.9 GB</text><rect x="314.67" y="183.60" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="room"/><text x="450.00" y="202.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="room">140 GB of FP16 weights leave</text><text x="450.00" y="221.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="room">52 GB free on a 192 GB H100</text><text x="314.67" y="262.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="req">The 42.9 GB cache fits beside the</text><text x="314.67" y="280.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="req">weights at 131,072 positions; a</text><text x="314.67" y="298.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="req">262,144-position context would</text><text x="314.67" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="req">need 85.9 GB and would not.</text><text x="613.33" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="streams">Four concurrent streams</text><line x1="613.33" y1="51.20" x2="884.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="streams"/><rect x="613.33" y="61.20" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="four-streams"/><text x="748.67" y="79.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="four-streams">4 x 32.77 GB = 131.1 GB of</text><text x="748.67" y="98.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="four-streams">cache</text><rect x="613.33" y="122.40" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="over-room"/><text x="748.67" y="141.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="over-room">more than the 52 GB left after</text><text x="748.67" y="160.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="over-room">the weights</text><rect x="613.33" y="183.60" width="270.67" height="74.80" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="shared-pool"/><text x="748.67" y="203.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="shared-pool">which is why admission</text><text x="748.67" y="222.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="shared-pool">reserves the pool, not the</text><text x="748.67" y="241.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="shared-pool">request</text><text x="613.33" y="284.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="streams">The pool is what makes</text><text x="613.33" y="302.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="streams">concurrency possible: a shared</text><text x="613.33" y="320.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="streams">262,144-position pool costs 85.9</text><text x="613.33" y="338.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="streams">GB once, instead of four private</text><text x="613.33" y="356.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="streams">caches.</text></svg>