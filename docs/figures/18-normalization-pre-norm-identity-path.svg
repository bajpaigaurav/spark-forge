<svg class="fig-svg" viewBox="0 0 900 282" width="100%" role="img" aria-labelledby="fig-title-c337dc0f" aria-describedby="fig-desc-c337dc0f" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-c337dc0f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-c337dc0f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="282" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-c337dc0f">Pre-norm keeps the identity path outside the norm</title><desc id="fig-desc-c337dc0f">In a pre-norm block the normalization sits inside each sublayer&#x27;s input and the residual addition stays outside it, so the identity path above the stages is not multiplied by a normalization Jacobian. Post-norm moves the normalization after the addition, putting J_LN on that path; that is the path that needs warmup.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Pre-norm: a = x + Attn(LN(x)); x&#x27; = a + MLP(LN(a)). The addition is outside the norm, so dy/dx = I +</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">J_f(LN(x))·J_LN(x). Post-norm: y = LN(x + f(x)), so the identity path is multiplied by J_LN; Xiong et</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">al. 2020 link that multiplication to the warmup requirement.</text><text x="16.00" y="126.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="identity">residual stream: outside both norms</text><path d="M16,134.8 L884,134.8" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-c337dc0f)" data-part="identity"/><rect x="16.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="norm1"/><text x="77.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="norm1">LN(x)</text><text x="77.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="norm1">d_model</text><rect x="165.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="attn"/><text x="226.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="attn">Attn</text><text x="226.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="attn">4d_model²</text><rect x="314.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="add1"/><text x="375.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="add1">+ x</text><text x="375.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="add1">residual</text><rect x="463.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="norm2"/><text x="524.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="norm2">LN(a)</text><text x="524.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="norm2">d_model</text><rect x="612.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="mlp"/><text x="673.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="mlp">MLP</text><text x="673.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="mlp">8d_model²</text><rect x="761.00" y="166.80" width="123.00" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="add2"/><text x="822.50" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="add2">+ a</text><text x="822.50" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="add2">residual</text><path d="M884,134.8 L884,160.8" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-c337dc0f)" data-part="identity"/></svg>