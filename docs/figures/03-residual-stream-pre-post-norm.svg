<svg class="fig-svg" viewBox="0 0 900 424" width="100%" role="img" aria-labelledby="fig-title-53677602" aria-describedby="fig-desc-53677602" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-53677602" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-53677602" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="424" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-53677602">Where the norm sits decides what the identity path carries</title><desc id="fig-desc-53677602">Post-norm puts LayerNorm after the addition, so the norm&#x27;s Jacobian multiplies the identity term and rescaling sits directly in the gradient path. Pre-norm normalizes only the sublayer branch, leaving a bare identity term; that is why it trains without warmup, and why the stream&#x27;s norm is never renormalized and grows with depth.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">Same five columns, same boxes. Each chain leaves exactly one column empty: that empty column is the</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">whole argument.</text><text x="210.80" y="89.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">x in</text><text x="360.40" y="89.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">norm before F</text><text x="510.00" y="89.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">sublayer F</text><text x="659.60" y="89.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">add</text><text x="809.20" y="89.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">norm after add</text><text x="16.00" y="165.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-post">post-norm</text><text x="16.00" y="183.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-post">2017 paper</text><rect x="143.00" y="145.20" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-post-0"/><text x="210.80" y="170.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-post-0">x</text><rect x="292.60" y="145.20" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" stroke-dasharray="3 3" data-part="cell-post-1"/><text x="360.40" y="170.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-post-1">—</text><rect x="442.20" y="145.20" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-post-2"/><text x="510.00" y="170.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-post-2">F(x)</text><rect x="591.80" y="145.20" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-post-3"/><text x="659.60" y="170.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-post-3">x + F(x)</text><rect x="741.40" y="145.20" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2" data-part="cell-post-4"/><text x="809.20" y="161.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-post-4">LayerNorm(x +</text><text x="809.20" y="179.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-post-4">F(x))</text><line x1="278.60" y1="169.20" x2="292.60" y2="169.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-post"/><line x1="428.20" y1="169.20" x2="442.20" y2="169.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-post"/><line x1="577.80" y1="169.20" x2="591.80" y2="169.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-post"/><line x1="727.40" y1="169.20" x2="741.40" y2="169.20" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-post"/><path d="M210.80,145.20 L210.80,119.20 L659.60,119.20 L659.60,145.20" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.3" marker-end="url(#arrow-accent-53677602)" data-part="chain-post"/><text x="435.20" y="114.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="middle" data-part="chain-post">identity</text><text x="16.00" y="215.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-post">Jacobian J_N + J_N J_F. The norm&#x27;s own Jacobian multiplies the identity term, so rescaling sits in the gradient path;</text><text x="16.00" y="231.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-post">magnitude stays bounded, and practice paid for it with learning-rate warmup.</text><text x="16.00" y="307.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-pre">pre-norm</text><text x="16.00" y="325.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-pre">GPT-2, GPT-3,</text><text x="16.00" y="343.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-pre">LLaMA</text><rect x="143.00" y="295.60" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-pre-0"/><text x="210.80" y="321.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-0">x</text><rect x="292.60" y="295.60" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-pre-1"/><text x="360.40" y="321.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-1">LayerNorm(x)</text><rect x="442.20" y="295.60" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-pre-2"/><text x="510.00" y="321.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-2">F(LayerNorm(x))</text><rect x="591.80" y="295.60" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-pre-3"/><text x="659.60" y="312.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-3">x +</text><text x="659.60" y="330.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-3">F(LayerNorm(x))</text><rect x="741.40" y="295.60" width="135.60" height="48.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" stroke-dasharray="3 3" data-part="cell-pre-4"/><text x="809.20" y="321.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-pre-4">—</text><line x1="278.60" y1="319.60" x2="292.60" y2="319.60" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-pre"/><line x1="428.20" y1="319.60" x2="442.20" y2="319.60" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-pre"/><line x1="577.80" y1="319.60" x2="591.80" y2="319.60" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-pre"/><line x1="727.40" y1="319.60" x2="741.40" y2="319.60" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-53677602)" data-part="chain-pre"/><path d="M210.80,295.60 L210.80,269.60 L659.60,269.60 L659.60,295.60" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.3" marker-end="url(#arrow-accent-53677602)" data-part="chain-pre"/><text x="435.20" y="264.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="middle" data-part="chain-pre">identity</text><text x="16.00" y="366.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-pre">Jacobian I + J_F J_N. The identity term is a bare I and the norm multiplies only the branch. The stream is never</text><text x="16.00" y="382.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-pre">renormalized, so L writes of variance v leave it with standard deviation sqrt(Lv).</text></svg>