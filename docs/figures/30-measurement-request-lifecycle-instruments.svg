<svg class="fig-svg" viewBox="0 0 900 513" width="100%" role="img" aria-labelledby="fig-title-d6fed125" aria-describedby="fig-desc-d6fed125" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-d6fed125" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-d6fed125" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="513" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-d6fed125">One request seen by three instruments</title><desc id="fig-desc-d6fed125">The client wall clock starts before the request reaches the engine and ends after detokenization, so it includes tokenization, admission, queueing, prefill, decode and client overhead. The engine&#x27;s counters split the same request into 3.33 s of prefill and 8.38 s of decode, and TTFT is 3.46 s, 0.13 s above prefill. The three numbers add to nearly twelve seconds, which is why the wall clock says nearly twelve seconds while no single counter explains why.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">3.33 + 8.38 + 0.13 s is nearly twelve seconds. The 0.13 s is the sum of queueing, cache lookup and</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the first decode step; the metrics do not break it down further. The wall clock also includes</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">tokenization, admission, detokenization and the client&#x27;s own overhead, which no counter separates.</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">This is the mean request from the 98-request window, not a single trace.</text><text x="183.67" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="arrival">arrival</text><text x="311.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="queue">queue</text><text x="438.33" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="prefill">prefill</text><text x="565.67" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ttft">first token</text><text x="693.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode</text><text x="820.33" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="wall-clock">last token</text><text x="16.00" y="176.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="wall-clock">wall clock</text><line x1="16.00" y1="206.40" x2="884.00" y2="206.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="wall-clock"/><rect x="121.00" y="142.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">0</text><rect x="757.67" y="142.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="wall-clock"/><text x="820.33" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="wall-clock">≈12 s</text><text x="16.00" y="246.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="arrival">counters</text><line x1="16.00" y1="276.40" x2="884.00" y2="276.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="arrival"/><rect x="375.67" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="438.33" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">prefill 3.33 s</text><rect x="503.00" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">TTFT 3.46 s</text><rect x="630.33" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="693.00" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">decode 8.38 s</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="prefill">logs</text><line x1="16.00" y1="346.40" x2="884.00" y2="346.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="prefill"/><rect x="121.00" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">start</text><rect x="503.00" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">first token</text><rect x="757.67" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="wall-clock"/><text x="820.33" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="wall-clock">end</text><text x="16.00" y="386.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="decode">tokens</text><line x1="16.00" y1="416.40" x2="884.00" y2="416.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="decode"/><rect x="121.00" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">prompt tokens</text><rect x="503.00" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">1</text><rect x="630.33" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="693.00" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">607</text><text x="16.00" y="456.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ttft">gap</text><line x1="16.00" y1="486.40" x2="884.00" y2="486.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="ttft"/><rect x="503.00" y="422.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">0.13 s</text></svg>