<svg class="fig-svg" viewBox="0 0 900 513" width="100%" role="img" aria-labelledby="fig-title-896b5a59" aria-describedby="fig-desc-896b5a59" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-896b5a59" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-896b5a59" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="513" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-896b5a59">One request seen by three instruments</title><desc id="fig-desc-896b5a59">The client wall clock starts before the request reaches the engine and ends after detokenization, so it includes tokenization, admission, queueing, prefill, decode and client overhead. The engine&#x27;s counters split the same request into 8 s of prefill and 2 s of decode, and time to first token is 8.2 s, a fifth of a second above prefill. The counters sum to ten seconds while the wall clock says eleven, and the missing second is where queueing, tokenization, detokenization and client overhead live.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">8 + 2 + 0.2 s is ten seconds; the wall clock says eleven. The 0.2 s is the sum of queueing, cache</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">lookup and the first decode step, which the counters do not break down further. The remaining second</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">is tokenization, admission, detokenization and the client&#x27;s own overhead, which no counter separates.</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The illustration is schematic: the counters report means over a window, not one trace.</text><text x="183.67" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="arrival">arrival</text><text x="311.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="queue">queue</text><text x="438.33" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="prefill">prefill</text><text x="565.67" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ttft">first token</text><text x="693.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode</text><text x="820.33" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="wall-clock">last token</text><text x="16.00" y="176.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="wall-clock">wall clock</text><line x1="16.00" y1="206.40" x2="884.00" y2="206.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="wall-clock"/><rect x="121.00" y="142.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">0</text><rect x="757.67" y="142.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="wall-clock"/><text x="820.33" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="wall-clock">≈11 s</text><text x="16.00" y="246.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="arrival">counters</text><line x1="16.00" y1="276.40" x2="884.00" y2="276.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="arrival"/><rect x="375.67" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="438.33" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">prefill 8 s</text><rect x="503.00" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">TTFT 8.2 s</text><rect x="630.33" y="212.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="693.00" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">decode 2 s</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="prefill">logs</text><line x1="16.00" y1="346.40" x2="884.00" y2="346.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="prefill"/><rect x="121.00" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">start</text><rect x="503.00" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">first token</text><rect x="757.67" y="282.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="wall-clock"/><text x="820.33" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="wall-clock">end</text><text x="16.00" y="386.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="decode">tokens</text><line x1="16.00" y1="416.40" x2="884.00" y2="416.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="decode"/><rect x="121.00" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="183.67" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">prompt tokens</text><rect x="503.00" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">1</text><rect x="630.33" y="352.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="693.00" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">generated</text><text x="16.00" y="456.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ttft">gap</text><line x1="16.00" y1="486.40" x2="884.00" y2="486.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="ttft"/><rect x="503.00" y="422.40" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="565.67" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">0.2 s</text></svg>