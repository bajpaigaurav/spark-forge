<svg class="fig-svg" viewBox="0 0 900 221" width="100%" role="img" aria-labelledby="fig-title-f713d5d1" aria-describedby="fig-desc-f713d5d1" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f713d5d1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f713d5d1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="221" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f713d5d1">The table is a lookup, not an ordering</title><desc id="fig-desc-f713d5d1">The lookup is one gather. The id arrives as an integer with no geometry, indexes E — a table of V rows, each d_model wide — and the gather returns one row, the chapter&#x27;s king row (0.8, 0.1), which becomes x in the residual stream. No arithmetic mixes rows, and nothing in the id is ordered: it records when a BPE merge happened.</desc><rect x="16.00" y="20.00" width="417.00" height="61.20" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="id"/><text x="224.50" y="52.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="id">id for king: an integer, a merge rank</text><rect x="467.00" y="20.00" width="417.00" height="61.20" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="table"/><text x="675.50" y="52.56" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="table">E: V rows x d_model</text><path d="M675.5,81.19999999999999 L675.5,98.19999999999999 L224.5,98.19999999999999 L224.5,115.19999999999999" fill="none" stroke="var(--color-muted, #5a6070)" stroke-width="1.2" marker-end="url(#arrow-f713d5d1)"/><rect x="16.00" y="115.20" width="417.00" height="61.20" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="row"/><text x="224.50" y="147.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row">gather returns one row: (0.8, 0.1)</text><rect x="467.00" y="115.20" width="417.00" height="61.20" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="vector"/><text x="675.50" y="136.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="vector">x: width d_model, into the residual</text><text x="675.50" y="158.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="vector">stream</text></svg>