<svg class="fig-svg" viewBox="0 0 900 332" width="100%" role="img" aria-labelledby="fig-title-21cbebdc" aria-describedby="fig-desc-21cbebdc" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-21cbebdc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-21cbebdc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="332" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-21cbebdc">The table is a lookup, not an ordering</title><desc id="fig-desc-21cbebdc">Four rows of the chapter&#x27;s two-dimensional toy table. The token id selects a row by offset; the row&#x27;s coordinates are the vector the rest of the network reads. The id is a merge-order position, so adjacent rows are not semantically adjacent, and nothing in the number says man is near woman.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="table">The highlighted row is the one the id selects. The row numbers are positions in this excerpt, not a</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="table">rank: the id records when a BPE merge happened. A gather returns one row; no arithmetic mixes rows.</text><rect x="295.42" y="103.20" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="table"/><rect x="300.42" y="108.20" width="62.00" height="42.00" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2" data-part="table"/><text x="331.42" y="11