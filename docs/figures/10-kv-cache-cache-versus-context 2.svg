<svg class="fig-svg" viewBox="0 0 760 219" width="100%" role="img" aria-labelledby="fig-title-58eb3762" aria-describedby="fig-desc-58eb3762" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-58eb3762" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-58eb3762" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="219" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-58eb3762">Cache bytes grow linearly with positions</title><desc id="fig-desc-58eb3762">At 928 bytes per position the cache is a straight line in context length: 130,659 positions give 121 MB, 262,144 give 243 MB, and 1,048,576 give the 0.9 GiB the config budgets. The added 786,432 positions cost 0.675 GiB, rounded to 0.68 GiB. Bar values are those multiplications, not separately measured sizes.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">928 bytes per position per rank. The pool holds 262,144 positions in four 65,536-position shares; the</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">native window is 1,048,576.</text><text x="16.00" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">130,659 prompt</text><rect x="188.00" y="75.48" width="45.51" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="239.51" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">121 MB</text><text x="16.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">262,144 pool</text><rect x="188.00" y="109.48" width="91.41" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="285.41" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">243 MB = 262,144 x 928 B</text><text x="16.00" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">786,432 added</text><rect x="188.00" y="143.48" width="274.59" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="468.59" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.68 GiB</text><text x="16.00" y="192.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">1,048,576 window</text><rect x="188.00" y="177.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="192.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.9 GiB</text></svg>