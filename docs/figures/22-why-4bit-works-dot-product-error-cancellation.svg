<svg class="fig-svg" viewBox="0 0 760 167" width="100%" role="img" aria-labelledby="fig-title-b933d491" aria-describedby="fig-desc-b933d491" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-b933d491" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-b933d491" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="167" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-b933d491">Aligned rounding errors add linearly; independent errors add in quadrature</title><desc id="fig-desc-b933d491">With N = 4,096 terms, a half-step of 0.067, and an input RMS of 0.5, aligned errors would add to 4,096 × 0.0335 = 137.2. Independent errors add in quadrature: the worst case is √4,096 × 0.0335 = 2.14, and uniform rounding gives a per-term standard deviation of (step/√12) × x_rms ≈ 0.0192, so √4,096 × 0.0192 ≈ 1.23. The ratio between the linear and quadrature totals is 64, the square root of N.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The ratio is 64 = √4,096. Aligned errors share a sign; independent errors cancel in quadrature.</text><text x="16.00" y="62.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">aligned: 4,096 ×</text><text x="16.00" y="78.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.0335</text><rect x="188.00" y="57.24" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="71.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">137.2</text><text x="16.00" y="96.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">independent worst</text><text x="16.00" y="112.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">case: √4,096 × 0.0335</text><rect x="188.00" y="91.24" width="5.71" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="199.71" y="105.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">2.14</text><text x="16.00" y="130.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">uniform rounding:</text><text x="16.00" y="146.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">√4,096 × 0.0192</text><rect x="188.00" y="125.24" width="3.28" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="197.28" y="139.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">1.23</text></svg>