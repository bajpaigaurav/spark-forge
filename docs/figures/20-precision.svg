<svg class="fig-svg" viewBox="0 0 760 188" width="100%" role="img" aria-labelledby="fig-title-3616ff8d" aria-describedby="fig-desc-3616ff8d" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-3616ff8d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-3616ff8d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="188" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-3616ff8d">One float, three layouts: sign, exponent, mantissa</title><desc id="fig-desc-3616ff8d">It shows the actual bit fields the prose names in sequence, drawn to scale, so the trade is visible: bf16 keeps fp32&#x27;s exponent range and gives up mantissa bits, which is why it replaces fp32 without a scaling factor.</desc><rect x="16.00" y="26.00" width="22.75" height="52.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="27.38" y="46.19" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">si</text><text x="27.38" y="61.19" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">gn</text><text x="27.38" y="95.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.16" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">1</text><rect x="38.75" y="26.00" width="182.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1.6"/><text x="129.75" y="53.69" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">exponent</text><text x="129.75" y="95.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.16" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">8</text><rect x="220.75" y="26.00" width="523.25" height="52.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="482.38" y="53.69" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">mantissa</text><text x="482.38" y="95.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.16" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="middle">23</text><line x1="16.00" y1="99.28" x2="744.00" y2="99.28" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="16.00" y="113.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.552" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">most significant</text><text x="744.00" y="113.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.552" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">least significant</text><text x="16.00" y="132.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">fp16: sign 1, exponent 5, mantissa 10. bf16: sign 1, exponent 8, mantissa 7. fp16 tops out at 65,504; bf16</text><text x="16.00" y="147.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">reaches fp32’s range with fewer mantissa bits.</text></svg>