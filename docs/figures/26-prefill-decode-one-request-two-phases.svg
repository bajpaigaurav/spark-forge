<svg class="fig-svg" viewBox="0 0 900 513" width="100%" role="img" aria-labelledby="fig-title-fc9a496a" aria-describedby="fig-desc-fc9a496a" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-fc9a496a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-fc9a496a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="513" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-fc9a496a">One request, two phases that share a machine</title><desc id="fig-desc-fc9a496a">Prefill is a matrix-matrix multiply over the 130,659-token prompt: every weight block is reused across all N rows, intensity is about N operations per byte, and the phase is compute-bound at 39,237 tok/s. It takes 3.33 s and emits no text. Decode is a matrix-vector multiply per token: the weights are read in full for one row, intensity is one operation per byte, and the phase is bandwidth-bound at 59.1 tok/s. The 607 generated tokens take 8.38 s. TTFT is 3.46 s, 0.13 s above prefill.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Prefill is 3.33 s and decode is 8.38 s of engine time; TTFT 3.46 s leaves 0.13 s for queueing, cache</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">lookup and the first decode step. The rates are means over a 98-request window: 130,659 prompt tokens</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">and 607 generated tokens per request, 39,237 prefill tok/s and 59.1 decode tok/s. Prefill intensity</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">is 130,659 FLOP/byte because each bf16 weight is used N times for one 2-byte read.</text><text x="196.40" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="arrival">arrive</text><text x="349.20" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="prefill">prefill</text><text x="502.00" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ttft">first token</text><text x="654.80" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode</text><text x="807.60" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="finish">finish</text><text x="16.00" y="176.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="arrival">phase</text><line x1="16.00" y1="206.40" x2="884.00" y2="206.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="arrival"/><rect x="121.00" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="196.40" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">queue</text><rect x="273.80" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">3.33 s</text><rect x="426.60" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="502.00" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">TTFT 3.46 s</text><rect x="579.40" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">8.38 s</text><rect x="732.20" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="finish"/><text x="807.60" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="finish">done</text><text x="16.00" y="246.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="prefill">regime</text><line x1="16.00" y1="276.40" x2="884.00" y2="276.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="prefill"/><rect x="273.80" y="212.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">compute-bound</text><rect x="579.40" y="212.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="243.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">bandwidth-bound</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ttft">tokens</text><line x1="16.00" y1="346.40" x2="884.00" y2="346.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="ttft"/><rect x="121.00" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="196.40" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">130,659 prompt</text><rect x="273.80" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">130,659 processed</text><rect x="426.60" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="502.00" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">1 emitted</text><rect x="579.40" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">607 generated</text><rect x="732.20" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="finish"/><text x="807.60" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="finish">607 total</text><text x="16.00" y="386.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="decode">KV cache</text><line x1="16.00" y1="416.40" x2="884.00" y2="416.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="decode"/><rect x="273.80" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="374.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">written for</text><text x="349.20" y="392.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">prompt</text><rect x="579.40" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">read + append</text><text x="16.00" y="456.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="finish">rate</text><line x1="16.00" y1="486.40" x2="884.00" y2="486.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="finish"/><rect x="273.80" y="422.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">39,237 tok/s</text><rect x="579.40" y="422.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">59.1 tok/s</text></svg>