<svg class="fig-svg" viewBox="0 0 900 491" width="100%" role="img" aria-labelledby="fig-title-fb933424" aria-describedby="fig-desc-fb933424" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-fb933424" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-fb933424" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="491" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-fb933424">One request, two phases that share a machine</title><desc id="fig-desc-fb933424">Prefill is a matrix-matrix multiply over the 100,000-token prompt: every weight block is reused across all N rows, intensity is about N operations per byte, and the phase is compute-bound. Decode is a matrix-vector multiply per token: the weights are read in full for one row, intensity is one operation per byte, and the phase is bandwidth-bound. Nothing can be emitted until prefill finishes, which is why time to first token tracks the prefill term.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Prefill runs N rows through each weight block, so intensity is N operations per byte and the ALUs</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">bind. Decode runs one row, so intensity is one operation per byte and the memory bus binds: a 70B</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">model at four bits reads 35 GB per token, and at 3,350 GB/s the floor is 10.4 ms per token.</text><text x="196.40" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="arrival">arrive</text><text x="349.20" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="prefill">prefill</text><text x="502.00" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ttft">first token</text><text x="654.80" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode</text><text x="807.60" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="finish">finish</text><text x="16.00" y="155.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="arrival">phase</text><line x1="16.00" y1="184.80" x2="884.00" y2="184.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="arrival"/><rect x="121.00" y="120.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="196.40" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">queue</text><rect x="273.80" y="120.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">prefill</text><rect x="426.60" y="120.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="502.00" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">first token</text><rect x="579.40" y="120.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">decode</text><rect x="732.20" y="120.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="finish"/><text x="807.60" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="finish">done</text><text x="16.00" y="225.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="prefill">regime</text><line x1="16.00" y1="254.80" x2="884.00" y2="254.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="prefill"/><rect x="273.80" y="190.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="221.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">compute-bound</text><rect x="579.40" y="190.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="221.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">bandwidth-bound</text><text x="16.00" y="295.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="ttft">tokens</text><line x1="16.00" y1="324.80" x2="884.00" y2="324.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="ttft"/><rect x="121.00" y="260.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="arrival"/><text x="196.40" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="arrival">100,000 prompt</text><rect x="273.80" y="260.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">100,000 processed</text><rect x="426.60" y="260.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="ttft"/><text x="502.00" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="ttft">1 emitted</text><rect x="579.40" y="260.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">1 per step</text><rect x="732.20" y="260.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="finish"/><text x="807.60" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="finish">done</text><text x="16.00" y="365.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="decode">KV cache</text><line x1="16.00" y1="394.80" x2="884.00" y2="394.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="decode"/><rect x="273.80" y="330.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="352.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">written for</text><text x="349.20" y="370.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">prompt</text><rect x="579.40" y="330.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="361.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">read + append</text><text x="16.00" y="435.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="finish">limiter</text><line x1="16.00" y1="464.80" x2="884.00" y2="464.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="finish"/><rect x="273.80" y="400.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill"/><text x="349.20" y="431.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill">ALUs</text><rect x="579.40" y="400.80" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="decode"/><text x="654.80" y="431.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="decode">memory bus</text></svg>