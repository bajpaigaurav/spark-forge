<svg class="fig-svg" viewBox="0 0 900 266" width="100%" role="img" aria-labelledby="fig-title-663485bf" aria-describedby="fig-desc-663485bf" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-663485bf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-663485bf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="266" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-663485bf">What the decoder actually receives</title><desc id="fig-desc-663485bf">Hidden width 256. Five source tokens carry 1,280 floats of embeddings, fifty carry 12,800, and the summary has 256 slots for either. The strips are drawn to one scale, so the solid head is the same size in both plain-seq2seq rows and the dashed remainder is what the decoder never sees. Bahdanau keeps every annotation instead, so its strip is solid end to end.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">The gradient is the other half of the bottleneck. Back through T recurrent steps the derivative is a</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">product of T−1 Jacobians; with each factor 0.4, twenty steps give 0.4^19 ≈ 2.7 × 10^-8.</text><text x="16.00" y="102.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-plain-5">plain seq2seq</text><text x="16.00" y="120.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-plain-5">5 source tokens</text><rect x="174.00" y="91.20" width="9.48" height="30.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="row-plain-5"/><rect x="183.48" y="91.20" width="37.92" height="30.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" stroke-dasharray="3 3" data-part="row-plain-5"/><text x="229.40" y="111.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="row-plain-5">256 survive</text><text x="325.99" y="111.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="row-plain-5">1,280 discarded</text><text x="16.00" y="158.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-plain-50">plain seq2seq</text><text x="16.00" y="176.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-plain-50">50 source tokens</text><rect x="174.00" y="147.20" width="9.48" height="30.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="row-plain-50"/><rect x="183.48" y="147.20" width="464.52" height="30.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" stroke-dasharray="3 3" data-part="row-plain-50"/><text x="656.00" y="167.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="row-plain-50">256 survive</text><text x="752.59" y="167.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="row-plain-50">12,800 discarded</text><text x="16.00" y="214.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-bahdanau">Bahdanau attention</text><text x="16.00" y="232.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="row-bahdanau">50 source tokens</text><rect x="174.00" y="203.20" width="474.00" height="30.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="row-bahdanau"/><text x="411.00" y="223.22" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="row-bahdanau">all 12,800 kept, read at every step</text></svg>