<svg class="fig-svg" viewBox="0 0 900 421" width="100%" role="img" aria-labelledby="fig-title-c9ec36c5" aria-describedby="fig-desc-c9ec36c5" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-c9ec36c5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-c9ec36c5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="421" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-c9ec36c5">What survives the bottleneck</title><desc id="fig-desc-c9ec36c5">A phase table for a plain encoder–decoder. The encoder writes one annotation per source token; the bottleneck keeps only the final 256-float state, so five source tokens&#x27; 1,280 floats and fifty tokens&#x27; 12,800 floats must both fit in the same 256 slots. Bahdanau&#x27;s addition keeps the annotations and lets every decoder step read them, but the recurrence remains.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Plain seq2seq keeps only h_T, so 1,280 or 12,800 floats of embeddings compress into 256 slots. The</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">gradient back to the first source word is a product of T−1 Jacobians: with each factor 0.4, twenty</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">steps give 0.4^19 ≈ 2.7 × 10^-8.</text><text x="247.33" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">encode source</text><text x="502.00" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">bottleneck</text><text x="756.67" y="119.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode target</text><text x="16.00" y="155.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">source tokens</text><line x1="16.00" y1="184.80" x2="884.00" y2="184.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="120.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="247.33" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">5 → 1,280 floats; 50 → 12,800</text><rect x="375.67" y="120.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="502.00" y="151.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">discarded</text><text x="16.00" y="225.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">annotations h_j</text><line x1="16.00" y1="254.80" x2="884.00" y2="254.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="190.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="247.33" y="221.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">one per source token</text><rect x="375.67" y="190.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="502.00" y="221.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">discarded in plain seq2seq</text><rect x="630.33" y="190.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="756.67" y="212.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">kept: attention reads all</text><text x="756.67" y="230.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">(Bahdanau)</text><text x="16.00" y="295.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">summary h_T</text><line x1="16.00" y1="324.80" x2="884.00" y2="324.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="260.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="247.33" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">last state</text><rect x="375.67" y="260.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="502.00" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">256 floats: the only crossing</text><rect x="630.33" y="260.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="756.67" y="291.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decoder start state</text><text x="16.00" y="365.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">target tokens</text><line x1="16.00" y1="394.80" x2="884.00" y2="394.80" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="630.33" y="330.80" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="756.67" y="361.43" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">one per step</text></svg>