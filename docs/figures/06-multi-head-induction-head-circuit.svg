<svg class="fig-svg" viewBox="0 0 900 379" width="100%" role="img" aria-labelledby="fig-title-d10ba4bc" aria-describedby="fig-desc-d10ba4bc" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-d10ba4bc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-d10ba4bc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="379" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-d10ba4bc">How a previous-token head becomes an induction head</title><desc id="fig-desc-d10ba4bc">Two layers on one column grid. Layer 1&#x27;s previous-token head attends from i to i−1 and writes c_i, a copy of x_{i−1}, into position i. Layer 2&#x27;s query is q_i = W_Q(x_i + c_i + r_i); the composition W_Q c_i is a 64-vector produced by the 64×64 matrix W_Q W_O^{h1}. A parallel shift puts x_{j−1} at position j&#x27;s key, so the query matches wherever x_{j−1} = x_i, and the value there is x_j, the token that followed the earlier occurrence.</desc><text x="198.33" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">x_i</text><text x="323.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">attend i−1</text><text x="447.67" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">c_i</text><text x="572.33" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">q_i</text><text x="697.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">keys x_{j−1}</text><text x="821.67" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-muted, #5a6070)" text-anchor="middle">value x_j</text><text x="16.00" y="118.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-layer1">layer 1</text><rect x="143.00" y="80.00" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-x-i"/><text x="198.33" y="105.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-x-i">x_i at</text><text x="198.33" y="123.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-x-i">position i</text><rect x="267.67" y="80.00" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-attend"/><text x="323.00" y="105.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-attend">attends to</text><text x="323.00" y="123.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-attend">i−1</text><rect x="392.33" y="80.00" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2" data-part="cell-copy"/><text x="447.67" y="105.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-copy">c_i = copy</text><text x="447.67" y="123.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-copy">of x_{i−1}</text><line x1="253.67" y1="113.00" x2="267.67" y2="113.00" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-d10ba4bc)" data-part="chain-layer1"/><line x1="378.33" y1="113.00" x2="392.33" y2="113.00" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-d10ba4bc)" data-part="chain-layer1"/><text x="16.00" y="168.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-layer1">A previous-token head: it attends from i to i−1 and writes a copy of x_{i−1} into position i&#x27;s residual.</text><text x="16.00" y="271.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="chain-layer2">layer 2</text><rect x="392.33" y="232.40" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" stroke-dasharray="3 3" data-part="ghost-c"/><text x="447.67" y="258.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ghost-c">c_i from</text><text x="447.67" y="276.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="ghost-c">layer 1</text><rect x="517.00" y="232.40" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2" data-part="cell-query"/><text x="572.33" y="249.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-query">q_i =</text><text x="572.33" y="267.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-query">W_Q(x_i +</text><text x="572.33" y="285.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-query">c_i + r_i)</text><rect x="641.67" y="232.40" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="cell-key"/><text x="697.00" y="258.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-key">key holds</text><text x="697.00" y="276.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="cell-key">x_{j−1}</text><rect x="766.33" y="232.40" width="110.67" height="66.00" rx="4" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2" data-part="cell-value"/><text x="821.67" y="258.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-value">lands on j:</text><text x="821.67" y="276.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="cell-value">value x_j</text><line x1="503.00" y1="265.40" x2="517.00" y2="265.40" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-d10ba4bc)" data-part="chain-layer2"/><line x1="627.67" y1="265.40" x2="641.67" y2="265.40" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-d10ba4bc)" data-part="chain-layer2"/><line x1="752.33" y1="265.40" x2="766.33" y2="265.40" stroke="var(--color-muted, #5a6070)" stroke-width="1.1" marker-end="url(#arrow-d10ba4bc)" data-part="chain-layer2"/><text x="16.00" y="320.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-layer2">An induction head: W_Q c_i is a 64-vector produced by the 64×64 matrix W_Q W_O^{h1}. The key shift by one turns a</text><text x="16.00" y="336.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="chain-layer2">match into a next-token prediction.</text></svg>