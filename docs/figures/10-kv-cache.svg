<svg class="fig-svg" viewBox="0 0 900 400" width="100%" role="img" aria-labelledby="fig-title-1e00cffa" aria-describedby="fig-desc-1e00cffa" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-1e00cffa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-1e00cffa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-1e00cffa">The decode loop: prefill fills the cache, every later step reads it</title><desc id="fig-desc-1e00cffa">It shows what the prose describes in sequence but a box diagram loses: the same 130,659 positions are computed once in prefill, and each of the 607 decode steps reads that stored cache instead of recomputing it.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Without the cache each step re-feeds 130,659 then 130,660 ... up to 131,265 tokens and throws the</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">recomputed keys and values away.</text><text x="196.40" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">prefill</text><text x="349.20" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode 1</text><text x="502.00" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode 2</text><text x="654.80" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">...</text><text x="807.60" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode 607</text><text x="16.00" y="133.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">tokens read</text><line x1="16.00" y1="163.20" x2="884.00" y2="163.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="196.40" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">130,659</text><rect x="273.80" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="349.20" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">1 new</text><rect x="426.60" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="502.00" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">1 new</text><rect x="579.40" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="654.80" y="129.83" font-family