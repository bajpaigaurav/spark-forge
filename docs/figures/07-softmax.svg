<svg class="fig-svg" viewBox="0 0 900 228" width="100%" role="img" aria-labelledby="fig-title-272452ff" aria-describedby="fig-desc-272452ff" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-272452ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-272452ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="228" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-272452ff">Scores to shares: subtract the row max, exponentiate, normalise</title><desc id="fig-desc-272452ff">It shows the chapter worked example as the two rows it is: raw scores 2, 1, 0 and the shares 0.665, 0.245, 0.090 they become. The subtraction is what keeps exp from overflowing at 65,504.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Subtract the row maximum first: exp(2-2), exp(1-2), exp(0-2) still sum to 11.107. fp16 tops out at</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">65,504; exp(11.1) is 65,536.</text><rect x="94.00" y="103.20" width="72.00" height="52.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><rect x="99.00" y="129.20" width="62.00" height="21.00" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2"/><text x="130.00" y="115.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">2</text><rect x="166.00" y="103.20" width="72.00"