<svg class="fig-svg" viewBox="0 0 900 209" width="100%" role="img" aria-labelledby="fig-title-e9949097" aria-describedby="fig-desc-e9949097" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-e9949097" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-e9949097" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="209" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-e9949097">Column-parallel f, then row-parallel g, one all-reduce</title><desc id="fig-desc-e9949097">It shows the pair the prose describes in sequence: x is multiplied by column slices with no collective, the slices concatenate, then row-parallel slices produce partial sums and one all-reduce finishes the layer.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">A transformer block has two f/g pairs (QKV then output, MLP up then down), so two all-reduces per</text><text x="16.00" y="33.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">block.</text><rect x="16.00" y="93.20" width="101.71" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2"/><text x="66.86" y="122.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">x: B x H</text><text x="66.86" y="171.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">B x H</text