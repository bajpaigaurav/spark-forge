ll through each layer</text><rect x="492" y="12" width="420" height="112" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="70.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">query/key/value per token</text><line x1="702.0" y1="124" x2="702.0" y2="150" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="150" width="420" height="112" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="208.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">KV cache blocks for shared prefix</text><line x1="702.0" y1="262" x2="702.0" y2="288" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="288" width="420" height="112" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="313.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">cache key: model weights/version,</text><text x="702.0" y="335.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">tokenizer, adapter or LoRA identity,</text><text x="702.0" y="357.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">dtype, block size, starting position</text><text x="702.0" y="379.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">or block index</text><line x1="702.0" y1="400" x2="702.0" y2="426" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="426" width="420" height="112" rx="4" 