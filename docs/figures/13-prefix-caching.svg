<svg class="fig-svg" viewBox="0 0 900 260" width="100%" role="img" aria-labelledby="fig-title-5d1efead" aria-describedby="fig-desc-5d1efead" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-5d1efead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-5d1efead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="260" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-5d1efead">Two requests, one prefix: the same blocks are read twice</title><desc id="fig-desc-5d1efead">It shows the reuse the prose describes in sequence: request B starts at position 0 and finds the prefix already in the pool, so only its new tokens need a prefill pass. The hash chain is what decides whether the match is real.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Each block hash is chained to the hash of the block before it, so a hit requires the whole prefix to</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">match. Only full blocks are cached.</text><text x="247.33" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">positions 0 to k</text><text x="502.00" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">new tokens</text><text x="756.67" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode</text><text x="16.00" y="133.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">request A</text><line x1="16.00" y1="163.20" x2="884.00" y2="163.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="99.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="247.33" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">prefill</text><rect x="375.67" y="99.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1"/><text x="502.00" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">-</text><rect x="630.33" y="99.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="756.67" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">attends to cache</text><text x="16.00" y="203.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">request B</text><line x1="16.00" y1="233.20" x2="884.00" y2="233.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="169.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="247.33" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">hash hit</text><rect x="375.67" y="169.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="502.00" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">prefill</text><rect x="630.33" y="169.20" width="252.67" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="756.67" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">attends to cache</text></svg>