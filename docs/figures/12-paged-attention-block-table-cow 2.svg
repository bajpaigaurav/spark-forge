<svg class="fig-svg" viewBox="0 0 900 509" width="100%" role="img" aria-labelledby="fig-title-4c1f71d2" aria-describedby="fig-desc-4c1f71d2" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-4c1f71d2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-4c1f71d2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="509" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-4c1f71d2">A block table is the indirection that makes sharing and copy-on-write cheap</title><desc id="fig-desc-4c1f71d2">A 100-token prompt fills seven 16-position blocks whose physical ids are 7, 12, 3, 19, 22, 8, and 41. After B forks, both block tables point at the same blocks with refcount 2; when B writes into logical block 6, the engine copies physical block 41 into free block 55 and drops 41 to refcount 1.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The strip is a 64-block window of a pool that holds 262,144 positions, 16 per block. Scattered</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">physical blocks are free placement; the table is what turns them back into a contiguous logical</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">sequence.</text><rect x="16.00" y="120.80" width="868.00" height="46.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.4"/><rect x="56.69" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="110.94" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="124.50" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="178.75" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="273.69" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="314.38" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="572.06" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="a-blocks"/><rect x="761.94" y="120.80" width="13.56" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="b-copy"/><line x1="16.00" y1="188.40" x2="884.00" y2="188.40" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="16.00" y1="184.40" x2="16.00" y2="192.40" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="16.00" y="208.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0</text><line x1="450.00" y1="184.40" x2="450.00" y2="192.40" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="450.00" y="208.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-si