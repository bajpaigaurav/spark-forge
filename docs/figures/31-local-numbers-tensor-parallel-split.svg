<svg class="fig-svg" viewBox="0 0 900 326" width="100%" role="img" aria-labelledby="fig-title-bf7bdcf2" aria-describedby="fig-desc-bf7bdcf2" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-bf7bdcf2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-bf7bdcf2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="326" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-bf7bdcf2">Two ranks, 17.5 GB each, 64 all-reduces per forward pass</title><desc id="fig-desc-bf7bdcf2">Tensor parallelism splits every weight matrix rather than splitting the layer stack, so each rank holds 35 GB ÷ 2 = 17.5 GB and reads only its own half per decode step. Each transformer layer crosses the split twice, after the attention output projection and after the MLP down-projection, so 32 layers need 2 × 32 = 64 all-reduces per forward pass. The residual stream stays local to each rank; only the partial activation crosses the cable.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">The split is by matrix, not by layer, so each rank reads 17.5 GB per decode step rather than 35 GB.</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">What the split buys is capacity; what it costs is 2 × 32 = 64 collectives per forward pass, each of</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">which blocks both ranks until the partial sums land. At decode the batch is small and the payload is</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">small, so the cost is latency. At prefill the payload grows with the prompt and the collective</text><text x="16.00" y="100.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">becomes a bandwidth problem of its own.</text><text x="16.00" y="170.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="residual">residual stream, rank-local</text><path d="M16,178.0 L884,178.0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-bf7bdcf2)" data-part="residual"/><rect x="16.00" y="210.00" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="shard"/><text x="92.40" y="238.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="shard">weight shard</text><text x="92.40" y="288.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="shard">17.5 GB per rank</text><rect x="194.80" y="210.00" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="block"/><text x="271.20" y="227.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="block">transformer</text><text x="271.20" y="249.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="block">block</text><text x="271.20" y="279.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="block">attention, then</text><text x="271.20" y="296.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="block">MLP</text><rect x="373.60" y="210.00" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="collective"/><text x="450.00" y="238.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="collective">all-reduce</text><text x="450.00" y="288.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="collective">bf16 activations</text><rect x="552.40" y="210.00" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="next"/><text x="628.80" y="238.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="next">next block</text><text x="628.80" y="288.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="next">repeat 32 times</text><rect x="731.20" y="210.00" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="logits"/><text x="807.60" y="238.96" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="logits">logits</text><text x="807.60" y="288.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="logits">vocabulary row</text><path d="M884,178.0 L884,204.0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-bf7bdcf2)" data-part="residual"/></svg>