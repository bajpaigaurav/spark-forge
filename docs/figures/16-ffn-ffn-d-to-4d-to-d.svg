<svg class="fig-svg" viewBox="0 0 900 282" width="100%" role="img" aria-labelledby="fig-title-47bde36a" aria-describedby="fig-desc-47bde36a" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-47bde36a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-47bde36a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="282" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-47bde36a">d_model → 4d_model → d_model, with the residual running past</title><desc id="fig-desc-47bde36a">The feed-forward sublayer reads one position&#x27;s residual vector, widens it to four times d_model, bends each coordinate, and contracts back to d_model. The bypass is the residual addition that attention also leaves intact. At d_model = 4,096 and m = 16,384 the pair holds 8d_model² = 134,217,728 parameters per layer.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Per layer the pair holds 2·d_model·m = 8d_model² = 134,217,728 parameters at d_model = 4,096, twice</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">attention&#x27;s 4d_model². A gated variant replaces the single up-projection with W_g and W_v and sets m</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">= 8d_model/3, so 3·d_model·m stays 8d_model².</text><text x="16.00" y="126.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="residual">residual stream: x</text><path d="M16,134.8 L884,134.8" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-47bde36a)" data-part="residual"/><rect x="16.00" y="166.80" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="input"/><text x="92.40" y="184.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="input">x, width</text><text x="92.40" y="206.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="input">d_model</text><text x="92.40" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="input">d_model = 4,096</text><rect x="194.80" y="166.80" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="up"/><text x="271.20" y="184.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="up">W1: d_model ×</text><text x="271.20" y="206.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="up">4d_model</text><text x="271.20" y="236.57" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="up">m = 4d_model =</text><text x="271.20" y="253.57" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="up">16,384</text><rect x="373.60" y="166.80" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="bend"/><text x="450.00" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="bend">bend</text><text x="450.00" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="bend">per element</text><rect x="552.40" y="166.80" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="down"/><text x="628.80" y="184.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="down">W2: 4d_model ×</text><text x="628.80" y="206.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="down">d_model</text><text x="628.80" y="236.57" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="down">pair: 8d_model² =</text><text x="628.80" y="253.57" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="down">134,217,728</text><rect x="731.20" y="166.80" width="152.80" height="54.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.2" data-part="add"/><text x="807.60" y="195.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="18.0" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="add">add to x</text><text x="807.60" y="245.07" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="add">residual</text><path d="M884,134.8 L884,160.8" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.6" marker-end="url(#arrow-accent-47bde36a)" data-part="residual"/></svg>