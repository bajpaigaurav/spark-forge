<svg class="fig-svg" viewBox="0 0 900 534" width="100%" role="img" aria-labelledby="fig-title-f4ac2578" aria-describedby="fig-desc-f4ac2578" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f4ac2578" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f4ac2578" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="534" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f4ac2578">The memguard loop: floor, SIGKILL, reload, retry</title><desc id="fig-desc-f4ac2578">Unified memory makes the footprint one shared number: 111.5 GB across the pair, roughly 55.8 GB per rank, and no separate VRAM to spill into. memguard.sh polls MemAvailable; below 2.5 GiB it sends SIGKILL, which cannot be caught, so the rank does not flush caches or close sockets. The kernel closes the sockets, in-flight requests get a connection reset, the launcher restarts the rank, and the shard reloads from disk before the client&#x27;s retry can succeed.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The engine&#x27;s device_memory_bytes gauge reads 111,515,771,428 bytes, about 55.8 GB per rank, covering</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">weights, caches and live streams. The KV pool is 262,144 positions at 921.6 bytes per position, so</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the pool is not what crosses the floor; growth in live streams and the page cache is. SIGKILL is the</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">point: a graceful stop would let the rank release the pool, and the floor exists to keep the host</text><text x="16.00" y="100.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">from thrashing before that can happen.</text><text x="183.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">steady state</text><text x="311.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">KV grows</text><text x="438.33" y="153.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">sample</text><text x="438.33" y="170.77" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">MemAvailable</text><text x="565.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">below floor</text><text x="693.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">SIGKILL</text><text x="820.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">restart</text><text x="16.00" y="198.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">footprint</text><line x1="16.00" y1="228.00" x2="884.00" y2="228.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="164.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="194.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">111.5 GB</text><rect x="248.33" y="164.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="194.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">+ KV pool</text><rect x="757.67" y="164.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="820.33" y="185.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">reload 55.8 GB</text><text x="820.33" y="203.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">shard</text><text x="16.00" y="268.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">MemAvailable</text><line x1="16.00" y1="298.00" x2="884.00" y2="298.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="234.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="264.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">above 2.5 GiB</text><rect x="248.33" y="234.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="264.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">falling</text><rect x="375.67" y="234.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="438.33" y="264.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">sampled</text><rect x="503.00" y="234.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="565.67" y="264.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">&lt; 2.5 GiB</text><rect x="757.67" y="234.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="820.33" y="264.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">recovers</text><text x="16.00" y="338.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">memguard.sh</text><line x1="16.00" y1="368.00" x2="884.00" y2="368.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="375.67" y="304.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="438.33" y="334.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">timer</text><rect x="503.00" y="304.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="565.67" y="334.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decides</text><rect x="630.33" y="304.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="693.00" y="334.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">SIGKILL</text><text x="16.00" y="408.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">rank</text><line x1="16.00" y1="438.00" x2="884.00" y2="438.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="374.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="404.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">serving</text><rect x="248.33" y="374.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="404.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">allocating</text><rect x="630.33" y="374.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="693.00" y="404.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">dies</text><rect x="757.67" y="374.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="820.33" y="404.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">restarts</text><text x="16.00" y="478.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">client</text><line x1="16.00" y1="508.00" x2="884.00" y2="508.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="630.33" y="444.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3"/><text x="693.00" y="465.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">connection</text><text x="693.00" y="483.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">reset</text><rect x="757.67" y="444.00" width="125.33" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="820.33" y="474.63" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">retries</text></svg>