<svg class="fig-svg" viewBox="0 0 924 374" width="100%" role="img" aria-label="Row-major weight layout and affine 4-bit quantization" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Row-major weight layout and affine 4-bit quantization</title><rect x="12" y="12" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="48.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">W: d_out × d_in</text><line x1="222.0" y1="80" x2="222.0" y2="106" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="106" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="142.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">row-major rows</text><line x1="222.0" y1="174" x2="222.0" y2="200" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="200" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="225.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">contiguous 128 entries = 128 input</text><text x="222.0" y="247.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">features of one output channel</text><line x1="222.0" y1="268" x2="222.0" y2="294" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="294" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="330.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">min, max per group</text><rect x="492" y="12" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="48.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">scale s = (max − min)/15</text><line x1="702.0" y1="80" x2="702.0" y2="106" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="106" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="142.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">zero point z = round(−min/s)</text><line x1="702.0" y1="174" x2="702.0" y2="200" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="200" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="236.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">q = clamp(round(w/s)+z, 0, 15)</text><line x1="702.0" y1="268" x2="702.0" y2="294" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="492" y="294" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="702.0" y="330.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">decode ŵ = (q − z)·s</text><path d="M222.0,328.0 L222.0,388.0 L702.0,388.0 L702.0,46.0" fill="none" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/></svg>