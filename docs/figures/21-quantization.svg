<svg class="fig-svg" viewBox="0 0 900 334" width="100%" role="img" aria-labelledby="fig-title-2dfc6b70" aria-describedby="fig-desc-2dfc6b70" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-2dfc6b70" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-2dfc6b70" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="334" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-2dfc6b70">One group of weights onto sixteen levels</title><desc id="fig-desc-2dfc6b70">It shows the mapping the prose describes in sequence: a contiguous run of 128 entries gets one min and one max, a scale of (max-min)/15, and a zero point, so each weight lands on an integer from 0 to 15 and decodes as (q - z) times s.</desc><text x="16.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start">what is stored per group</text><line x1="16.00" y1="51.20" x2="436.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><rect x="16.00" y="61.20" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">128 input features</text><rect x="16.00" y="100.80" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">one min, one max</text><rect x="16.00" y="140.40" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">scale s = (max - min)/15</text><rect x="16.00" y="180.00" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="197.45" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">zero point z = round(-min/s)</text><rect x="16.00" y="219.60" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="237.05" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">4-bit codes, 0 to 15</text><text x="16.00" y="277.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Per-group scales are what make 4-bit weights</text><text x="16.00" y="295.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">usable.</text><text x="464.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start">what each weight costs</text><line x1="464.00" y1="51.20" x2="884.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><rect x="464.00" y="61.20" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">fp16: 16 bits per weight</text><rect x="464.00" y="100.80" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">4-bit: 4 bits plus a share of s and z</text><rect x="464.00" y="140.40" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode: w_hat = (q - z) * s</text><text x="464.00" y="198.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The decode is one multiply-add per weight.</text></svg>