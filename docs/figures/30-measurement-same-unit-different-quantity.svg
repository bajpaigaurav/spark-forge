<svg class="fig-svg" viewBox="0 0 760 240" width="100%" role="img" aria-labelledby="fig-title-fbf19139" aria-describedby="fig-desc-fbf19139" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-fbf19139" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-fbf19139" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="240" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-fbf19139">Three tokens-per-second numbers that are not the same quantity</title><desc id="fig-desc-fbf19139">All three bars carry the unit tokens/s and none of them measures the same thing. Wall clock divides 1,600 tokens by 27.1 s of total request time and gets 59.1, but that total includes the prefill of each prompt. The counters divide 607 generated tokens by 8.38 s of decode alone and get 72.4. The concurrency-four run sums four streams and gets 106.2, a 1.80× multiplier. Quoting one without saying which is the error.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The prefix cache contaminates prefill the same way. prompt_tokens_total is 12,804,579 and total</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">prefill time is 326.34 s, so the apparent rate is 39,237 tok/s. But 95.9% of those tokens were served</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">from cache; only 518,627 were computed, and 518,627 ÷ 326.34 = 1,589 tok/s. The cold-cache prefill is</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">about 24.7× the warm-cache prefill. Percentiles are no better: the p99 rank is ceil(0.99 × 98) = 98</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">of 98, which is the maximum.</text><text x="16.00" y="135.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">wall clock: 1,600 ÷</text><text x="16.00" y="151.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">27.1 s</text><rect x="188.00" y="130.20" width="203.68" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="397.68" y="144.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">59.1 tok/s</text><text x="16.00" y="178.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">counters: 607 ÷ 8.38 s</text><rect x="188.00" y="164.20" width="249.51" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="443.51" y="178.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">72.4 tok/s</text><text x="16.00" y="203.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">aggregate at</text><text x="16.00" y="219.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">concurrency 4</text><rect x="188.00" y="198.20" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="560.00" y="212.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">106.2 tok/s</text></svg>