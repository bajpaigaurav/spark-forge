<svg class="fig-svg" viewBox="0 0 760 258" width="100%" role="img" aria-labelledby="fig-title-f76cfe56" aria-describedby="fig-desc-f76cfe56" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f76cfe56" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f76cfe56" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="258" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f76cfe56">Three tokens-per-second numbers that are not the same quantity</title><desc id="fig-desc-f76cfe56">All three bars carry the unit tokens/s and none of them measures the same thing. Counter-derived decode divides generated tokens by decode seconds and approaches the batch-one ceiling, 3,350 ÷ 35 = 95.7 for a 70B model at four bits on a 3,350 GB/s card. End-to-end throughput divides every token in the request, prompt included, by the total request seconds, so it averages prefill in and reports less: two thirds of the ceiling is 2/3 × 95.7 = 63.8. Aggregate throughput at concurrency four reads the weights once for four rows, so it is 4 × 3,350 ÷ 35 = 383, and each stream still sees a quarter of it. Quoting one without saying which is the error.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">The same run reports three rates because the denominator changes. Decode-only counts generated tokens</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">over decode seconds; end-to-end counts every token over wall clock; aggregate counts the sum of</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">streams over the same wall clock. The third bar is the short-context case, where the cache term is</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">small. Add the cache and it shrinks: at a 100,000-token context one stream holds 100,000 × 327,680 =</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">32,768,000,000 bytes, four streams hold 131.07 GB, and 4 × 3,350 ÷ (35 + 131.07) = 80.7, below the</text><text x="16.00" y="94.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">batch-one ceiling.</text><text x="16.00" y="153.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-decode">counter-derived</text><text x="16.00" y="169.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-decode">decode, batch 1</text><rect x="188.00" y="148.44" width="91.45" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-decode"/><text x="285.45" y="163.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-decode">95.7 tok/s</text><text x="16.00" y="187.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-e2e">end-to-end, prompt</text><text x="16.00" y="203.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-e2e">included</text><rect x="188.00" y="182.44" width="60.97" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-e2e"/><text x="254.97" y="197.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-e2e">63.8 tok/s</text><text x="16.00" y="221.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-agg">aggregate, concurrency</text><text x="16.00" y="237.88" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-agg">4</text><rect x="188.00" y="216.44" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-agg"/><text x="560.00" y="231.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-agg">383 tok/s</text></svg>