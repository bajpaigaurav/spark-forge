<svg class="fig-svg" viewBox="0 0 900 427" width="100%" role="img" aria-labelledby="fig-title-27287150" aria-describedby="fig-desc-27287150" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-27287150" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-27287150" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="427" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-27287150">ReLU and GELU at the chapter&#x27;s sample points</title><desc id="fig-desc-27287150">Sampled at the points the chapter prints. ReLU&#x27;s column is exactly zero with zero derivative for every negative input; GELU dips to -0.1587 at x = -1 and keeps a nonzero derivative there, while its derivative at x = 0 is 0.5.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">GELU(x) = xΦ(x), and Φ(x) is the probability that a standard normal draw falls below x; the output is</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the input scaled by that probability. Its derivative is Φ(x)+xφ(x). The derivative is zero at the</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">minimum near x = -0.75 and approaches zero as x falls. GELU lacks ReLU&#x27;s exact zero-gradient region</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">but still saturates; a unit consistently below -3 learns slowly.</text><rect x="94.00" y="146.40" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="col-0"/><text x="130.00" y="178.70" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="col-0">-3</text><rect x="166.00" y="146.40" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="col-1"/><text x="202.00" y="178.70" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="col-1">0</text><rect x="238.00" y="146.40" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="col-2"/><text x="274.00" y="178.70" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="col-2">-0.0040</text><rect x="310.00" y="146.40" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="col-3"/><text x="346.00" y="178.70" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="col-3">-0.0119</text><rect x="94.00" y="198.40" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" data-part="col-0"/><text x="130.00" y="230.70" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="col-0">-2</text><rect x="166.00" y="198.40" width="72.00" he