<svg class="fig-svg" viewBox="0 0 760 240" width="100%" role="img" aria-labelledby="fig-title-019607c2" aria-describedby="fig-desc-019607c2" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-019607c2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-019607c2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="240" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-019607c2">Acceptance alone does not decide the speedup</title><desc id="fig-desc-019607c2">Speedup depends on acceptance and drafter cost, not acceptance alone. With k = 4, a drafter at α = 0.7, t_d = 0.2 t_t and t_v = 1.0 t_t gives E = 2.7731 over a 1.8 t_t round, or 1.54×. A faster drafter at α = 0.3 and t_d = 0.05 t_t gives E = 1.4251 over 1.2 t_t, or 1.19×. At α = 0.1 and t_v = 1.2 t_t, E = 1.1111 over 1.24 t_t, or 0.896× — slower than not speculating.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The engine&#x27;s counters report 67.6% acceptance: 42,181 accepted out of 62,390 drafted, from</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">mtp_accepted_total / mtp_drafted_total. That is an operational rate over mixed traffic, not a</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">controlled α: the counters do not record k, temperature, top-p, dataset or per-request breakdown, so</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">it cannot be dropped into the formula above without matching settings. A faster drafter accepted less</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">often can lose ground, as the middle bar shows.</text><text x="16.00" y="135.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">α = 0.7, t_d = 0.2</text><text x="16.00" y="151.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">t_t: E = 2.7731</text><rect x="188.00" y="130.20" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="144.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">1.54×</text><text x="16.00" y="169.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">α = 0.3, t_d = 0.05</text><text x="16.00" y="185.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">t_t: E = 1.4251</text><rect x="188.00" y="164.20" width="282.82" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="476.82" y="178.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">1.19×</text><text x="16.00" y="203.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">α = 0.1, t_v = 1.2</text><text x="16.00" y="219.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">t_t: E = 1.1111</text><rect x="188.00" y="198.20" width="212.95" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="406.95" y="212.76" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.896×</text></svg>