<svg class="fig-svg" viewBox="0 0 760 375" width="100%" role="img" aria-labelledby="fig-title-1894872f" aria-describedby="fig-desc-1894872f" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-1894872f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-1894872f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="375" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-1894872f">Softmax sharpens the weights; the alignment story is ours</title><desc id="fig-desc-1894872f">Three annotations scored 2.0, 1.0 and 0.0 get softmax shares 0.665, 0.245 and 0.090. Raising the first score to 4.0 gives 0.936, 0.047 and 0.017: the distribution sharpens toward a hard choice without becoming one. The weights are real numbers the model computed; reading them as word alignments is an interpretation, and Koehn and Knowles show it does not reliably hold.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">e^2, e^1, e^0 = 7.389, 2.718, 1.000, sum 11.107. Raise h₁ to 4.0: 54.598, 2.718, 1.000, sum 58.316.</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">The softmax gradient keeps a baseline, so the weights&#x27; score gradient sums to zero across source</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">positions.</text><line x1="16.00" y1="92.72" x2="744.00" y2="92.72" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-before"/><text x="16.00" y="108.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.248" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="group-before">before: scores 2.0, 1.0, 0.0</text><text x="16.00" y="136.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">h₁, score 2.0</text><rect x="188.00" y="121.72" width="260.03" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-before"/><text x="456.03" y="136.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">0.665</text><text x="16.00" y="170.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">h₂, score 1.0</text><rect x="188.00" y="155.72" width="95.80" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-before"/><text x="291.80" y="170.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">0.245</text><text x="16.00" y="204.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">h₃, score 0.0</text><rect x="188.00" y="189.72" width="35.19" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-before"/><text x="231.19" y="204.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-before">0.090</text><line x1="16.00" y1="230.72" x2="744.00" y2="230.72" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-after"/><text x="16.00" y="246.72" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.248" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="group-after">after raising h₁ to 4.0</text><text x="16.00" y="274.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">h₁, score 4.0</text><rect x="188.00" y="259.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="group-after"/><text x="562.00" y="274.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">0.936</text><text x="16.00" y="308.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">h₂, score 1.0</text><rect x="188.00" y="293.72" width="18.38" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-after"/><text x="214.38" y="308.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">0.047</text><text x="16.00" y="342.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">h₃, score 0.0</text><rect x="188.00" y="327.72" width="6.65" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="group-after"/><text x="202.65" y="342.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="group-after">0.017</text></svg>