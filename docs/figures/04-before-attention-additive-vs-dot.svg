<svg class="fig-svg" viewBox="0 0 900 441" width="100%" role="img" aria-labelledby="fig-title-8b5aa812" aria-describedby="fig-desc-8b5aa812" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-8b5aa812" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-8b5aa812" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="441" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-8b5aa812">Additive scoring versus one dot-product matrix</title><desc id="fig-desc-8b5aa812">At n = 20 decoder steps, m = 50 source positions, k = 128 and d = 512, additive scoring costs about 7.86M multiply-adds for the projections plus 128,000 for the per-pair dot, roughly 8M. Dot-product scoring costs 20 × 50 × 1024 = 1,024,000, about 16 times less. The penalty is the shape of the work: additive evaluates a tanh per pair over a k × n × m intermediate, dot-product is one GEMM producing one n × m sheet.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">Both sides are matrix multiplies. The difference is that additive materialises a k × n × m</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">intermediate and then reduces it, while dot product produces its result in one GEMM.</text><text x="16.00" y="91.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="panel-additive">additive (Bahdanau 2014)</text><text x="470.00" y="91.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="panel-dot">dot product (Luong 2015; Vaswani 2017)</text><g data-part="panel-additive"><rect x="105.00" y="120.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="98.00" y="127.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="91.00" y="134.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="84.00" y="141.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="77.00" y="148.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="70.00" y="155.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="63.00" y="162.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/></g><g data-part="panel-additive"><rect x="56.00" y="169.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2"/></g><g data-part="panel-additive"><line x1="56.00" y1="194.00" x2="306.00" y2="194.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="56.00" y1="219.00" x2="306.00" y2="219.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="56.00" y1="244.00" x2="306.00" y2="244.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="56.00" y1="269.00" x2="306.00" y2="269.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="87.25" y1="169.00" x2="87.25" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="118.50" y1="169.00" x2="118.50" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="149.75" y1="169.00" x2="149.75" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="181.00" y1="169.00" x2="181.00" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="212.25" y1="169.00" x2="212.25" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="243.50" y1="169.00" x2="243.50" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="274.75" y1="169.00" x2="274.75" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/></g><text x="181.00" y="233.13" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="panel-additive">e = vᵀ tanh(W₁h_j + W₂s_i)</text><g data-part="panel-additive"><line x1="367.00" y1="120.00" x2="367.00" y2="294.00" stroke="var(--color-muted, #5a6070)" stroke-width="1"/><line x1="363.00" y1="120.00" x2="371.00" y2="120.00" stroke="var(--color-muted, #5a6070)" stroke-width="1"/><line x1="363.00" y1="294.00" x2="371.00" y2="294.00" stroke="var(--color-muted, #5a6070)" stroke-width="1"/></g><text x="375.00" y="228.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="panel-additive">k = 128</text><text x="375.00" y="244.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="panel-additive">sheets</text><text x="181.00" y="318.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="panel-additive">m = 50 source positions</text><text x="56.00" y="110.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">n = 20 decoder steps</text><text x="16.00" y="340.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">≈ 7.86M + 0.128M ≈ 8M multiply-adds</text><text x="16.00" y="364.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">A tanh per pair, elementwise and memory-bound. A fused</text><text x="16.00" y="380.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">implementation can avoid materialising the full</text><text x="16.00" y="396.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">tensor, but then it cannot batch into one large</text><text x="16.00" y="412.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-additive">multiply.</text><g data-part="panel-dot"><rect x="510.00" y="169.00" width="250.00" height="125.00" rx="3" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.2"/></g><g data-part="panel-dot"><line x1="510.00" y1="194.00" x2="760.00" y2="194.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="510.00" y1="219.00" x2="760.00" y2="219.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="510.00" y1="244.00" x2="760.00" y2="244.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="510.00" y1="269.00" x2="760.00" y2="269.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="541.25" y1="169.00" x2="541.25" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="572.50" y1="169.00" x2="572.50" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="603.75" y1="169.00" x2="603.75" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="635.00" y1="169.00" x2="635.00" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="666.25" y1="169.00" x2="666.25" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="697.50" y1="169.00" x2="697.50" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/><line x1="728.75" y1="169.00" x2="728.75" y2="294.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.6"/></g><text x="635.00" y="233.13" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="panel-dot">S Hᵀ</text><text x="635.00" y="318.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="panel-dot">m = 50 source positions</text><text x="510.00" y="159.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-dot">n = 20 decoder steps</text><text x="470.00" y="340.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-dot">20 × 50 × 1024 = 1,024,000 multiply-adds</text><text x="470.00" y="364.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-dot">One GEMM, one sheet, ≈ 16× less arithmetic at these</text><text x="470.00" y="380.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-dot">lengths. The ratio shifts with n and m because the</text><text x="470.00" y="396.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.32" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="panel-dot">projection cost amortizes.</text></svg>