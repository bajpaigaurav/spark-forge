<svg class="fig-svg" viewBox="0 0 760 576" width="100%" role="img" aria-labelledby="fig-title-e81d0fd0" aria-describedby="fig-desc-e81d0fd0" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-e81d0fd0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-e81d0fd0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="576" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-e81d0fd0">The n x n score matrix: half of it is masked away</title><desc id="fig-desc-e81d0fd0">It shows the object the cost comes from: every query scores every key, so the matrix is n x n, and the causal mask keeps only the lower triangle. At n=130,659 that is 1.71e10 pairs and 34.1 GB per head in fp16.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">n = 130,659, so n x n is 1.71e10 entries. One head of one layer at 2 bytes is 34.1 GB; all 32 heads</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">is over a terabyte.</text><rect x="70.00" y="72.48" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9"/><rect x="116.00" y="72.48" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9"/><rect x="162.00" y="72.48" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9"/><rect x="208.00" y="72.48" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8b