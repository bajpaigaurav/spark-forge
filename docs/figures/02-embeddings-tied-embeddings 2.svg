<svg class="fig-svg" viewBox="0 0 760 203" width="100%" role="img" aria-labelledby="fig-title-8b8ce4c9" aria-describedby="fig-desc-8b8ce4c9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-8b8ce4c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-8b8ce4c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="203" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-8b8ce4c9">Tying saves a second copy of the embedding matrix</title><desc id="fig-desc-8b8ce4c9">Tying sets W = Eᵀ, so one V × d_model matrix serves both the input lookup and the output projection. GPT-2 small publishes 124M parameters with the matrix counted once; untied, the same model carries a second 38,597,376-number copy, about 163M, so tying saves roughly 24 percent of the untied count.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">50,257 × 768 = 38,597,376. GPT-2&#x27;s 124M already counts that matrix once. Untying adds a second copy:</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">124 + 38.6 ≈ 163M, so tying saves 38.6 / 163 ≈ 24% of the untied count. LLaMA-7B (32,000 × 4,096 =</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">131M) leaves the matrices untied.</text><text x="16.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">embedding matrix alone</text><rect x="188.00" y="93.72" width="86.67" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="280.67" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">38,597,376</text><text x="16.00" y="133.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">GPT-2 small, tied</text><text x="16.00" y="149.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">(published)</text><rect x="188.00" y="127.72" width="278.43" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="472.43" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">124M</text><text x="16.00" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">GPT-2 small, untied</text><rect x="188.00" y="161.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="176.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">≈163M</text></svg>