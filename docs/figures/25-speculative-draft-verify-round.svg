<svg class="fig-svg" viewBox="0 0 900 513" width="100%" role="img" aria-labelledby="fig-title-3ce317e9" aria-describedby="fig-desc-3ce317e9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-3ce317e9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-3ce317e9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="513" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-3ce317e9">One speculative round: draft, verify, accept, emit</title><desc id="fig-desc-3ce317e9">Speculative decoding drafts k tokens cheaply, then verifies all k in one batched target forward pass. Accept token i left to right with probability min(1, p_i/q_i); at the first rejection, sample from the residual max(0, p − q) and stop. The accepted prefix plus that sample is exact for the target distribution, so the output distribution is unchanged. With k = 4, α = 0.7, t_d = 0.2 t_t and t_v = 1.0 t_t, E = 2.7731 over a 1.8 t_t round, a 1.54× speedup.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Exactness: a token drafted with probability q and target probability p is emitted with q·min(1, p/q)</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">+ (1 − accept)·max(0, p − q)/Z = p. Example: q = (0.5, 0.3, 0.2), p = (0.2, 0.5, 0.3); A is accepted</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">with probability 0.4, and on rejection the residual (0, 0.2, 0.1)/0.3 samples B with 2/3 or C with</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">1/3. The output probabilities are 0.2, 0.5 and 0.3.</text><text x="196.40" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="draft">draft k = 4</text><text x="349.20" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="verify">verify one pass</text><text x="502.00" y="132.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="accept">accept left to</text><text x="502.00" y="149.17" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="accept">right</text><text x="654.80" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="residual">reject → residual</text><text x="807.60" y="140.67" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="emit">emit</text><text x="16.00" y="176.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="draft">drafter (cheap)</text><line x1="16.00" y1="206.40" x2="884.00" y2="206.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="draft"/><rect x="121.00" y="142.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="draft"/><text x="196.40" y="173.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="draft">x₁ x₂ x₃ x₄</text><text x="16.00" y="246.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="verify">target (one pass)</text><line x1="16.00" y1="276.40" x2="884.00" y2="276.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="verify"/><rect x="273.80" y="212.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="verify"/><text x="349.20" y="234.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="verify">p₁ p₂ p₃ p₄ +</text><text x="349.20" y="252.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="verify">bonus</text><text x="16.00" y="316.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="accept">acceptance</text><line x1="16.00" y1="346.40" x2="884.00" y2="346.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="accept"/><rect x="426.60" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="accept"/><text x="502.00" y="313.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="accept">min(1, p/q)</text><rect x="579.40" y="282.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="residual"/><text x="654.80" y="304.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="residual">sample ∝ max(0,</text><text x="654.80" y="322.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="residual">p−q)</text><text x="16.00" y="386.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="residual">KV cache</text><line x1="16.00" y1="416.40" x2="884.00" y2="416.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="residual"/><rect x="426.60" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="accept"/><text x="502.00" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="accept">keep accepted</text><rect x="579.40" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1" stroke-dasharray="3 3" data-part="residual"/><text x="654.80" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="residual">truncate the rest</text><rect x="732.20" y="352.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="emit"/><text x="807.60" y="383.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="emit">bonus kept</text><text x="16.00" y="456.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="emit">output</text><line x1="16.00" y1="486.40" x2="884.00" y2="486.40" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="emit"/><rect x="426.60" y="422.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="accept"/><text x="502.00" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="accept">accepted prefix</text><rect x="579.40" y="422.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="residual"/><text x="654.80" y="444.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="residual">stop at first</text><text x="654.80" y="462.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="residual">reject</text><rect x="732.20" y="422.40" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="emit"/><text x="807.60" y="453.03" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="emit">1 to k+1 tokens</text></svg>