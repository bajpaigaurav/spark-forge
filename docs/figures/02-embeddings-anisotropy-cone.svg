<svg class="fig-svg" viewBox="0 0 900 495" width="100%" role="img" aria-labelledby="fig-title-61046c22" aria-describedby="fig-desc-61046c22" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-61046c22" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-61046c22" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="495" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-61046c22">Same two rows, before and after the shared component comes out</title><desc id="fig-desc-61046c22">The chapter&#x27;s two rows drawn as rays from one origin, at the same scale. Before centering they sit close together and score cosine 0.917: the anisotropic cone. Subtract the table mean m = (1, 1) and the same rows both shrink and separate, scoring 0.166. All-but-the-Top does the rest: remove each centered vector&#x27;s projection onto the top principal components.</desc><text x="219.50" y="33.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="17.099999999999998" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">raw rows, before centering</text><line x1="46.00" y1="338.23" x2="356.00" y2="338.23" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><line x1="46.00" y1="338.23" x2="46.00" y2="28.23" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><g data-part="rays-raw"><circle cx="46.00" cy="338.23" r="2.50" fill="var(--color-ink, #1a1d24)" stroke="none" stroke-width="0"/><line x1="46.00" y1="338.23" x2="300.24" y2="171.39" stroke="var(--color-accent, #8a3324)" stroke-width="2" marker-end="url(#arrow-accent-61046c22)"/><circle cx="300.24" cy="171.39" r="3.00" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="300.24" y=