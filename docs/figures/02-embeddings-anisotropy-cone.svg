, #b8bcc4)" stroke-width="1"/><line x1="507.00" y1="338.23" x2="507.00" y2="28.23" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><g data-part="rays-centered"><circle cx="507.00" cy="338.23" r="2.50" fill="var(--color-ink, #1a1d24)" stroke="none" stroke-width="0"/><line x1="507.00" y1="338.23" x2="602.34" y2="330.29" stroke="var(--color-accent, #8a3324)" stroke-width="2" marker-end="url(#arrow-accent-61046c22)"/><circle cx="602.34" cy="330.29" r="3.00" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="602.34" y="321.29" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">a′</text><line x1="507.00" y1="338.23" x2="514.94" y2="242.89" stroke="var(--color-accent, #8a3324)" stroke-width="2" marker-end="url(#arrow-accent-61046c22)"/><circle cx="514.94" cy="242.89" r="3.00" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="514.94" y="233.89" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">b′</text></g><g data-part="arc-centered"><path d="M566.11,333.30 L565.93,331.50 L565.70,329.71 L565.41,327.92 L565.07,326.14 L564.67,324.37 L564.22,322.62 L563.72,320.88 L563.16,319.16 L562.56,317.45 L561.90,315.76 L561.18,314.10 L560.42,312.45 L559.61,310.84 L558.75,309.24 L557.84,307.68 L556.88,306.14 L555.88,304.63 L554.83,303.15 L553.74,301.71 L552.60,300.30 L551.42,298.93 L550.20,297.59 L548.94,296.29 L547.64,295.03 L546.30,293.81 L544.93,292.63 L543.52,291.49 L542.08,290.40 L540.60,289.35 L539.09,288.35 L537.55,287.39 L535.99,286.48 L534.39,285.62 L532.78,284.81 L531.13,284.05 L529.47,283.33 L527.78,282.67 L526.07,282.07 L524.35,281.51 L522.61,281.01 L520.86,280.56 L519.09,280.16 L517.31,279.82 L515.52,279.53 L513.73,279.30 L511.93,279.12" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.4"/></g><text x="680.50" y="363.32" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.040000000000001" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">a′ = (0.6, 0.05)    b′ = (0.05, 0.6)</text><text x="680.50" y="383.32" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.040000000000001" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">cos 0.166</text><text x="680.50" y="421.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.040000000000001" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">Both rows score 0.917 before centering because the</text><text x="680.50" y="441.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.040000000000001" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">table sits in a narrow cone. Taking out the shared</text><text x="680.50" y="461.23" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.040000000000001" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">component drops the same pair to 0.166.</text></svg>