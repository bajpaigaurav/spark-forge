<svg class="fig-svg" viewBox="0 0 900 400" width="100%" role="img" aria-labelledby="fig-title-b4a398ab" aria-describedby="fig-desc-b4a398ab" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-b4a398ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-b4a398ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="400" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-b4a398ab">One query&#x27;s row: score, softmax, weighted sum</title><desc id="fig-desc-b4a398ab">A query scores three keys with dot products 2, 1 and 0. Softmax turns those scores into shares 0.665, 0.245 and 0.090, and the shares weight the values into the output (0.755, 0.335). The row is a differentiable lookup: the query is the lookup key, the keys are the indices, the values are the contents.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">exp(2), exp(1), exp(0) = 7.389, 2.718, 1.000, sum 11.107; shares 0.665, 0.245, 0.090. The output is</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the share-weighted sum of the values. Scaling by 1/sqrt(d_k) is the next figure.</text><text x="215.50" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">project x → q, k, v</text><text x="406.50" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">s_j = q · k_j</text><text x="597.50" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">softmax row</text><text x="788.50" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">Σ a_j v_j</text><text x="16.00" y="133.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">v_1 = (1, 0)</text><line x1="16.00" y1="163.20" x2="884.00" y2="163.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="99.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="215.50" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">v_1</text><rect x="312.00" y="99.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="406.50" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">2</text><rect x="503.00" y="99.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="597.50" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.665</text><rect x="694.00" y="99.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="788.50" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.665 · v_1</text><text x="16.00" y="203.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">v_2 = (0, 1)</text><line x1="16.00" y1="233.20" x2="884.00" y2="233.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="169.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="215.50" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">v_2</text><rect x="312.00" y="169.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="406.50" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">1</text><rect x="503.00" y="169.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="597.50" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.245</text><rect x="694.00" y="169.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="788.50" y="199.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.245 · v_2</text><text x="16.00" y="273.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">v_3 = (1, 1)</text><line x1="16.00" y1="303.20" x2="884.00" y2="303.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="239.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="215.50" y="269.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">v_3</text><rect x="312.00" y="239.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="406.50" y="269.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0</text><rect x="503.00" y="239.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="597.50" y="269.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.090</text><rect x="694.00" y="239.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="788.50" y="269.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.090 · v_3</text><text x="16.00" y="343.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">output o</text><line x1="16.00" y1="373.20" x2="884.00" y2="373.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="694.00" y="309.20" width="189.00" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="788.50" y="339.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1