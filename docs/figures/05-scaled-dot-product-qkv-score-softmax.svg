<svg class="fig-svg" viewBox="0 0 900 353" width="100%" role="img" aria-labelledby="fig-title-bb5585ff" aria-describedby="fig-desc-bb5585ff" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-bb5585ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-bb5585ff" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="353" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-bb5585ff">One query&#x27;s row: the shares mix the values</title><desc id="fig-desc-bb5585ff">The softmax row is a mixture, not a choice. Each value vector is scaled by its share and the scaled vectors are laid head to tail: 0.665 v_1 + 0.245 v_2 + 0.090 v_3 ends at (0.755, 0.335). Both axes carry one scale, so a segment&#x27;s length is its share times its vector&#x27;s length.</desc><line x1="56.00" y1="241.00" x2="486.00" y2="241.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><line x1="56.00" y1="241.00" x2="56.00" y2="26.00" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="50.00" y="31.02" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">y</text><text x="50.00" y="246.02" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">0</text><text x="492.00" y="246.02" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">x</text><g data-part="mix-v1"><line x1="56.00" y1="241.00" x2="341.95" y2="241.00" stroke="var(--color-accent, #8a3324)" stroke-width="2.4" marker-end="url(#arrow-accent-bb5585ff)"/><text x="198.97" y="236.14" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.665 · v_1</text></g><g data-part="mix-v2"><line x1="341.95" y1="241.00" x2="341.95" y2="135.65" stroke="var(--color-accent, #8a3324)" stroke-width="2.4" marker-end="url(#arrow-accent-bb5585ff)"/><text x="351.95" y="193.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.245 · v_2</text></g><g data-part="mix-v3"><line x1="341.95" y1="135.65" x2="380.65" y2="96.95" stroke="var(--color-accent, #8a3324)" stroke-width="2.4" marker-end="url(#arrow-accent-bb5585ff)"/><text x="368.37" y="128.51" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">0.090 · v_3</text></g><g data-part="mix-sum"><line x1="56.00" y1="241.00" x2="380.65" y2="96.95" stroke="var(--color-muted, #5a6070)" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="380.65" cy="96.95" r="3.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="386.65" y="102.09" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">(0.755, 0.335)</text></g><text x="520.00" y="94.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="mix-sum">x:  0.665·1 + 0.245·0 + 0.090·1 = 0.755</text><text x="520.00" y="112.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="mix-sum">y:  0.665·0 + 0.245·1 + 0.090·1 = 0.335</text><text x="520.00" y="144.08" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">one scale on both axes; a segment&#x27;s length</text><text x="520.00" y="162.08" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">is its share times its vector&#x27;s length</text><text x="16.00" y="281.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">exp(2), exp(1), exp(0) = 7.389, 2.718, 1.000, sum 11.107, so the shares are 0.665, 0.245, 0.090. With v_1</text><text x="16.00" y="299.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">= (1, 0), v_2 = (0, 1), v_3 = (1, 1): 0.665 v_1 + 0.245 v_2 + 0.090 v_3 = (0.755, 0.335). Scaling by</text><text x="16.00" y="317.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">1/sqrt(d_k) is the next figure.</text></svg>