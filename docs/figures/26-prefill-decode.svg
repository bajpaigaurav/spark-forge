<svg class="fig-svg" viewBox="0 0 900 260" width="100%" role="img" aria-labelledby="fig-title-f18891c9" aria-describedby="fig-desc-f18891c9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f18891c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f18891c9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="260" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f18891c9">One request, two regimes, and where the 3.46 s goes</title><desc id="fig-desc-f18891c9">It shows the split the prose describes in sequence: prefill processes 130,659 rows at once and is compute-bound, decode emits 607 tokens one at a time and is bandwidth-bound, and time to first token covers both.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">TTFT is 3.46 s: admission, tokenization, prefill, and the first decode step. Prefill ran at 39,237</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">tokens/s; decode at 59.1.</text><text x="183.67" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">admission</text><text x="311.00" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">prefill</text><text x="438.33" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="1