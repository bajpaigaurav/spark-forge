<svg class="fig-svg" viewBox="0 0 760 255" width="100%" role="img" aria-labelledby="fig-title-e5555db3" aria-describedby="fig-desc-e5555db3" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-e5555db3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-e5555db3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="255" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-e5555db3">Four streams: 1.80× aggregate, 45% of the linear ceiling</title><desc id="fig-desc-e5555db3">Measured decode on the pair: one stream 59.1 tok/s, four streams 106.2 tok/s aggregate, a 1.80× multiplier, and 26.55 tok/s per stream. The linear prediction is 4 × 59.1 = 236.4 tok/s; the measured aggregate reaches 45% of it, so batching is sublinear. The per-stream rate is also 45% of the single-stream rate, which is the same shortfall seen from the other side.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The shortfall has several candidate causes and the run does not separate them: the bandwidth ceiling</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">N·B/(W+K), the 16-row decode kernel (ROUND_ROWS=16), the SM clock observed at 2,197 MHz against a</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">3,003 MHz silicon maximum, and the 120,000 ms cumulative pair stall. A roofline calculation can test</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">bandwidth; the rest needs profiling or controlled experiments.</text><text x="16.00" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">single stream</text><rect x="188.00" y="111.96" width="91.50" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="285.50" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">59.1 tok/s</text><text x="16.00" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">per stream, 4 streams</text><rect x="188.00" y="145.96" width="41.11" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="235.11" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">26.55 tok/s</text><text x="16.00" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">aggregate, 4 streams</text><rect x="188.00" y="179.96" width="164.42" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="358.42" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">106.2 tok/s (1.80×)</text><text x="16.00" y="219.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">linear prediction, 4 ×</text><text x="16.00" y="235.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">59.1</text><rect x="188.00" y="213.96" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="560.00" y="228.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">236.4 tok/s</text></svg>