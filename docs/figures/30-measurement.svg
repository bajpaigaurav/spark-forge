<svg class="fig-svg" viewBox="0 0 900 244" width="100%" role="img" aria-labelledby="fig-title-5f80dd62" aria-describedby="fig-desc-5f80dd62" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-5f80dd62" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-5f80dd62" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="244" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-5f80dd62">Where each number is taken, relative to the boundary</title><desc id="fig-desc-5f80dd62">It shows the measurement points the prose describes in sequence, and why numbers from different methods are not comparable: counters increment inside the server, logs timestamp at receive and send, and a client-side clock adds skew to whatever it reports.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Server counters give prefill 3.33 s over 98 requests. A client-side wall clock gives 1,600 tokens in</text><text x="16.00" y="33.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">27.1 s for four sequential 400-token requests: 59.1 tok/s.</text><text x="174.57" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">client sends</text><text x="283.71" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">network</text><text x="392.86" y="72.97" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">server</text><text x="392.86" y="89.97" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">receives</text><text x="502.00" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">prefill</text><text x="611.14" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">decode</text><text x="720.29" y="81.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">response sent</text><text x="829.43" y="72.97" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">client</text><text x="829.43" y="89.97" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">receives</text><text x="16.00" y="117.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">server</text><line x1="16.00" y1="147.20" x2="884.00" y2="147.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="83.20" width="107.14" height="58.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1.1"/><text x="174.57" y="113.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-ancho