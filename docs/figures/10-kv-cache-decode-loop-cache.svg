<svg class="fig-svg" viewBox="0 0 900 330" width="100%" role="img" aria-labelledby="fig-title-b488d81e" aria-describedby="fig-desc-b488d81e" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-b488d81e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-b488d81e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="330" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-b488d81e">Prefill writes the cache once; every decode step reads it</title><desc id="fig-desc-b488d81e">Prefill computes keys and values for all 100,000 prompt positions once. Each of the 600 decode steps then computes one new position and reads the stored cache instead of re-feeding the prefix. Without the cache, the final pass would re-feed 100,599 tokens and recompute keys and values it already had.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Without the cache, pass 600 would re-feed 100,599 tokens and recompute keys and values it already</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">had.</text><text x="196.40" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="prefill">prefill</text><text x="349.20" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode 1</text><text x="502.00" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode 2</text><text x="654.80" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">...</text><text x="807.60" y="97.47" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="decode">decode 600</text><text x="16.00" y="133.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="new-tokens">new tokens</text><line x1="16.00" y1="163.20" x2="884.00" y2="163.20" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="new-tokens"/><rect x="121.00" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="prefill new-tokens"/><text x="196.40" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="prefill new-tokens">100,000</text><rect x="273.80" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="new-tokens decode"/><text x="349.20" y="129.83" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="new-tokens decode">1</text><rect x="426.60" y="99.20" width="150.80" height="58.00" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="new-tokens decode"/><text x="502.00" y="129.83" fon