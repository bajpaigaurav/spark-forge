<svg class="fig-svg" viewBox="0 0 760 219" width="100%" role="img" aria-labelledby="fig-title-fb8e52dc" aria-describedby="fig-desc-fb8e52dc" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-fb8e52dc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-fb8e52dc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="219" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-fb8e52dc">One vector, V scores, V shares</title><desc id="fig-desc-fb8e52dc">It shows the final projection as the many-to-many map it is: h of width d_model scores every row of W, giving V logits, and softmax turns those into shares that sum to one.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Row w of W is a direction in d_model space; the score for that token is h . w. In a batch, B</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">sequences give B by V logits.</text><text x="16.00" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">h, one vector</text><rect x="188.00" y="75.48" width="22.88" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="216.88" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">d_model</text><text x="16.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">W, V rows</text><rect x="188.00" y="109.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">V rows by d_model</text><text x="16.00" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">s = h W^T</text><rect x="188.00" y="143.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="560.00" y="158.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">V logits</text><text x="16.00" y="192.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">softmax(s)</text><rect x="188.00" y="177.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="560.00" y="192.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">V shares, sum 1</text></svg>