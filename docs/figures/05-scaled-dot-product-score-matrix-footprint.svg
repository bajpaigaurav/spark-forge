<svg class="fig-svg" viewBox="0 0 900 267" width="100%" role="img" aria-labelledby="fig-title-8643175b" aria-describedby="fig-desc-8643175b" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-8643175b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-8643175b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="267" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-8643175b">One layer&#x27;s score matrix at 100,000 tokens</title><desc id="fig-desc-8643175b">The score matrix is what the quadratic cost buys. At n = 100,000 one head holds 10^10 entries, 20 GB in 16-bit precision; all 32 heads at once would be 640 GB, more than three times the 192 GB an H100 holds. Real implementations tile the computation, so the full matrix never materialises.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">At n = 100,000 the score matrix holds n^2 = 10^10 pairs. Per layer the attention arithmetic is 4 n^2</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">d_model = 4 × 10^10 × 4096 ≈ 1.6 × 10^14 FLOPs, 160 trillion. One head&#x27;s scores in 16-bit precision</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">are 10^10 entries × 2 bytes = 20 GB; 32 heads would need 640 GB. Since 640 GB is more than three</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">times 192 GB, implementations tile the computation and never hold the full matrix.</text><rect x="16.00" y="142.40" width="868.00" height="46.00" rx="0" fill="none" stroke="var(--color-ink, #1a1d24)" stroke-width="1.4"/><rect x="16.00" y="142.40" width="868.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="span-heads"/><text x="450.00" y="170.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="span-heads">32 heads: 640 GB</text><rect x="16.00" y="142.40" width="260.40" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="span-h100"/><text x="146.20" y="170.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="span-h100">H100: 192 GB</text><rect x="16.00" y="142.40" width="27.12" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1.1" data-part="span-one-head"/><text x="18.00" y="210.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.12" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="span-one-head">20 GB</text><line x1="16.00" y1="220.80" x2="884.00" y2="220.80" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="16.00" y1="216.80" x2="16.00" y2="224.80" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="16.00" y="240.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0</text><line x1="276.40" y1="216.80" x2="276.40" y2="224.80" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="276.40" y="240.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">192 GB</text><line x1="884.00" y1="216.80" x2="884.00" y2="224.80" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><text x="884.00" y="240.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">640 GB</text></svg>