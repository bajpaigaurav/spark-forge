<svg class="fig-svg" viewBox="0 0 760 463" width="100%" role="img" aria-labelledby="fig-title-f26c88ae" aria-describedby="fig-desc-f26c88ae" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-f26c88ae" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-f26c88ae" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="463" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-f26c88ae">The 3,350 GB/s roof, with model ceilings on it</title><desc id="fig-desc-f26c88ae">The bandwidth roof is 3,350 GB/s divided by the bytes read per token, so attainable throughput falls as the read grows. Every point is computed from that number; none is measured. A 70B model at FP16 reads 140 GB and tops out at 23.9 tok/s, at four bits 35 GB and 95.7; a 7B model at FP16 14 GB and 239, at four bits 3.5 GB and 957; GPT-3 at FP16 350 GB and 9.57. The roof line is sampled at 4, 8, 16, 32, 64, 128 and 256 GB per token, each sample 3,350 ÷ that read, and it enters the plot at 837.5 tokens per second.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The roof assumes one read of every byte per token; batching reuses each read across B rows and moves</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">a point right. The H100 ridge point is 295 FLOPs per byte, roughly three hundred times the intensity</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">of a decode step, so no compute roof appears in this window. The points are ceilings, not</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">predictions: a real kernel reaches a fraction of peak bandwidth, and KV traffic and collectives share</text><text x="16.00" y="78.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the same bus.</text><line x1="92.00" y1="392.64" x2="732.00" y2="392.64" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="162.64" x2="92.00" y2="392.64" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><line x1="92.00" y1="162.64" x2="92.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="92.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^0</text><line x1="252.00" y1="162.64" x2="252.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="252.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^1</text><line x1="412.00" y1="162.64" x2="412.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="412.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^2</text><line x1="572.00" y1="162.64" x2="572.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="572.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^3</text><line x1="732.00" y1="162.64" x2="732.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="732.00" y="415.44" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">10^4</text><line x1="92.00" y1="392.64" x2="732.00" y2="392.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="397.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^0</text><line x1="92.00" y1="315.97" x2="732.00" y2="315.97" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="320.53" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^1</text><line x1="92.00" y1="239.31" x2="732.00" y2="239.31" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="243.87" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^2</text><line x1="92.00" y1="162.64" x2="732.00" y2="162.64" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8" stroke-dasharray="2 3"/><text x="86.00" y="167.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="11.856" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="end">10^3</text><text x="412.00" y="447.36" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">GB read per token (log)</text><text x="29.68" y="277.64" transform="rotate(-90 29.68 277.64)" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">tokens/s (log)</text><polyline points="188.3,168.5 236.5,191.6 284.7,214.7 332.8,237.8 381.0,260.9 429.2,283.9 477.3,307.0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="2.2"/><circle cx="179.05" cy="164.10" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="179.05" y="139.78" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">7B 4-bit 957</text><circle cx="275.38" cy="210.30" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="275.38" y="185.98" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">7B FP16 239</text><circle cx="339.05" cy="240.77" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="339.05" y="216.45" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">70B 4-bit 95.7</text><circle cx="435.38" cy="286.96" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="435.38" y="262.64" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">70B FP16 23.9</text><circle cx="499.05" cy="317.44" r="4.50" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="0"/><text x="499.05" y="293.12" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">GPT-3 FP16 9.57</text><text x="471.32" y="300.98" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.463999999999999" font-weight="400" fill="var(--color-accent, #8a3324)" text-anchor="end">roof: 3,350 GB/s ÷ GB/token</text></svg>