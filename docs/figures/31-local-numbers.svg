<svg class="fig-svg" viewBox="0 0 834 300" width="100%" role="img" aria-label="Unified-memory budget and the memguard kill/restart loop on two GB10 boxes" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Unified-memory budget and the memguard kill/restart loop on two GB10 boxes</title><rect x="12" y="16" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="96.0" y="38.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Shared LPDDR5X pool:</text><text x="96.0" y="51.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">111.5 GB /</text><text x="96.0" y="64.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">111,515,771,428 bytes</text><text x="96.0" y="77.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">covering weights, KV</text><text x="96.0" y="90.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">caches, live streams</text><line x1="180" y1="60.5" x2="226" y2="60.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="226" y="16" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="310.0" y="57.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">MemAvailable read from</text><text x="310.0" y="70.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">/proc/meminfo on a timer</text><line x1="394" y1="60.5" x2="440" y2="60.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="440" y="16" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="524.0" y="64.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Threshold: below 2.5 GiB</text><line x1="608" y1="60.5" x2="654" y2="60.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="654" y="16" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="738.0" y="64.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">SIGKILL to rank PID</text><path d="M738.0,105 L738.0,128 L96.0,128 L96.0,151" fill="none" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="151" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="96.0" y="186.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Kernel closes sockets;</text><text x="96.0" y="199.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">in-flight requests get</text><text x="96.0" y="212.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">connection reset</text><line x1="180" y1="195.5" x2="226" y2="195.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="226" y="151" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="310.0" y="199.0" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Launcher restarts rank</text><line x1="394" y1="195.5" x2="440" y2="195.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="440" y="151" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="524.0" y="192.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Rank reloads its shard</text><text x="524.0" y="205.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">from disk</text><line x1="608" y1="195.5" x2="654" y2="195.5" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="654" y="151" width="168" height="89" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="738.0" y="192.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Client retries failed</text><text x="738.0" y="205.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">request</text></svg>