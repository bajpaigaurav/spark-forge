<svg class="fig-svg" viewBox="0 0 760 221" width="100%" role="img" aria-labelledby="fig-title-cd8f2046" aria-describedby="fig-desc-cd8f2046" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-cd8f2046" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-cd8f2046" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="221" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-cd8f2046">The pair&#x27;s aggregate roof is 31.2 tokens per second against 95.7 on one H100</title><desc id="fig-desc-cd8f2046">Bandwidth sets the roof. One rank reads 17.5 GB per step at 273 GB/s, so its ceiling is 273 ÷ 17.5 = 15.6 tokens per second, and two ranks together give 2 × 15.6 = 31.2. A single H100 reads 35 GB at 3,350 GB/s for 3,350 ÷ 35 = 95.7 tokens per second, which is 95.7 ÷ 31.2 = 3.07 times the pair&#x27;s aggregate. The pair&#x27;s figure is an upper bound: it assumes the 64 collectives per forward pass are free.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">Every bar is weights divided by bandwidth: 273 ÷ 17.5 = 15.6, 2 × 15.6 = 31.2, and 3,350 ÷ 35 = 95.7.</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">None of the three is a measurement. The pair&#x27;s bar ignores the collectives, the KV cache re-read per</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">stream, and the fraction of peak bandwidth a real kernel reaches, so the achievable rate sits below</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="note">31.2.</text><text x="16.00" y="117.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="rank">one rank, 17.5 GB at</text><text x="16.00" y="133.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="rank">273 GB/s</text><rect x="188.00" y="111.96" width="59.66" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="rank"/><text x="253.66" y="126.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="rank">15.6 tok/s</text><text x="16.00" y="151.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="pair">pair aggregate, 2</text><text x="16.00" y="167.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="pair">ranks</text><rect x="188.00" y="145.96" width="119.32" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="pair"/><text x="313.32" y="160.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="pair">31.2 tok/s</text><text x="16.00" y="185.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="h100">one H100, 35 GB at</text><text x="16.00" y="201.40" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="h100">3,350 GB/s</text><rect x="188.00" y="179.96" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="h100"/><text x="560.00" y="194.52" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="h100">95.7 tok/s</text></svg>