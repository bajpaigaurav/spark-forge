<svg class="fig-svg" viewBox="0 0 484 632" width="100%" role="img" aria-label="Memory hierarchy and the materialized L×L attention matrix" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Memory hierarchy and the materialized L×L attention matrix</title><rect x="12" y="12" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="42.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Registers (per thread)</text><line x1="242.0" y1="66" x2="242.0" y2="88" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="88" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="118.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Shared memory (per SM; 128 bytes/clk; 281 GB/s at 2,197 MHz)</text><line x1="242.0" y1="142" x2="242.0" y2="164" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="164" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="194.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">L2</text><line x1="242.0" y1="218" x2="242.0" y2="240" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="240" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="270.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">HBM/LPDDR5X (273 GB/s shared CPU+GPU)</text><line x1="242.0" y1="294" x2="242.0" y2="316" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="316" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="346.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">Q, K, V: each L×d with L=130,659, d=128</text><line x1="242.0" y1="370" x2="242.0" y2="392" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="392" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="422.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">S = QKᵀ: L×L = 1.707×10¹⁰ entries; 34.1 GB at 2 bytes</text><line x1="242.0" y1="446" x2="242.0" y2="468" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="468" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="498.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">softmax(S)</text><line x1="242.0" y1="522" x2="242.0" y2="544" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="544" width="460" height="54" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="242.0" y="574.5" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="11" font-weight="400" fill="var(--ink)" text-anchor="middle">O</text></svg>