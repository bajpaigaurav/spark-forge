<svg class="fig-svg" viewBox="0 0 924 374" width="100%" role="img" aria-label="Memory hierarchy and the materialized L×L attention matrix" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted, #666)"/></marker></defs><title>Memory hierarchy and the materialized L×L attention matrix</title><rect x="12" y="12" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="48.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">Registers (per thread)</text><line x1="222.0" y1="80" x2="222.0" y2="106" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="106" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="131.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">Shared memory (per SM; 128 bytes/clk;</text><text x="222.0" y="153.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">281 GB/s at 2,197 MHz)</text><line x1="222.0" y1="174" x2="222.0" y2="200" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="200" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="222.0" y="236.32" font-family='"Nimbus Sans", "Liberation Sans", Helvetica, sans-serif' font-size="18.5" font-weight="400" fill="var(--ink)" text-anchor="middle">L2</text><line x1="222.0" y1="268" x2="222.0" y2="294" stroke="var(--muted, #666)" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="294" width="420" height="68" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="2