<svg class="fig-svg" viewBox="0 0 900 377" width="100%" role="img" aria-labelledby="fig-title-e8de81db" aria-describedby="fig-desc-e8de81db" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-e8de81db" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-e8de81db" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="377" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-e8de81db">Why the two phases scale in opposite directions</title><desc id="fig-desc-e8de81db">The same weight matrix meets a matrix in prefill and a vector in decode. In prefill the weight block is loaded once into shared memory and reused for every row of the N-row activation matrix, so intensity is about N operations per byte; with N at 100,000 the ALUs are the constraint. In decode each weight is read once per emitted token, so intensity is one operation per byte and the 3,350 GB/s memory bus is the constraint: 35 GB per token gives a 10.4 ms floor. Batching raises decode intensity to B operations per byte, which is why more streams raise aggregate throughput.</desc><text x="16.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start">Prefill: N rows, compute-bound</text><line x1="16.00" y1="51.20" x2="436.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><rect x="16.00" y="61.20" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">X is N × d_model; N = 100,000</text><rect x="16.00" y="100.80" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">one weight block reused across all N rows</text><rect x="16.00" y="140.40" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">intensity ≈ N ops/byte = 100,000</text><rect x="16.00" y="180.00" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="226.00" y="197.45" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">the ALUs are the constraint</text><text x="16.00" y="237.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The 4d feedforward block is d_model × d_ff, but</text><text x="16.00" y="255.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">every weight element is read once and used N times,</text><text x="16.00" y="273.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">so the intensity argument holds whatever the</text><text x="16.00" y="291.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">matrix.</text><text x="464.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start">Decode: one row, bandwidth-bound</text><line x1="464.00" y1="51.20" x2="884.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1"/><rect x="464.00" y="61.20" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">one row per stream per decode step</text><rect x="464.00" y="100.80" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">each weight read once per emitted token</text><rect x="464.00" y="140.40" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">intensity = 1 op/byte</text><rect x="464.00" y="180.00" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="197.45" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">3,350 GB/s is the constraint</text><rect x="464.00" y="219.60" width="420.00" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="674.00" y="237.05" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">35 GB per token → 10.4 ms</text><text x="464.00" y="277.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Batching raises intensity: four streams give 4</text><text x="464.00" y="295.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">ops/byte, and aggregate decode rises toward the 4×</text><text x="464.00" y="313.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">ceiling, short of it because each stream adds its</text><text x="464.00" y="331.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">own cache read.</text></svg>