<svg class="fig-svg" viewBox="0 0 760 151" width="100%" role="img" aria-labelledby="fig-title-eb7b756f" aria-describedby="fig-desc-eb7b756f" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-eb7b756f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-eb7b756f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="151" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-eb7b756f">The score matrix is 510 times the keys and values it summarizes</title><desc id="fig-desc-eb7b756f">At L = 130,659 and d_head = 128, storing one head&#x27;s score matrix takes L^2 x 2 bytes = 34.1 GB, while its keys and values take 4Ld bytes = 66.9 MB. The ratio is L / 2d = 510x, and in FP32 the matrix would be 68.3 GB. FlashAttention stores none of it and recomputes the tiles in the backward pass for 4.37e12 extra FLOPs.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The 34.1 GB bar is L^2 x 2 bytes; 66.9 MB is 4Ld. At 262,144 positions the keys and values for one</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">head still fit in 134.2 MB, while the matrix would be four times larger than at 130,659.</text><text x="16.00" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">score matrix, one head</text><rect x="188.00" y="75.48" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="90.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">34.1 GB, L^2 x 2 bytes</text><text x="16.00" y="114.92" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">keys and values, one</text><text x="16.00" y="130.92" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">head</text><rect x="188.00" y="109.48" width="2.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="196.00" y="124.04" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">66.9 MB, 4Ld bytes</text></svg>