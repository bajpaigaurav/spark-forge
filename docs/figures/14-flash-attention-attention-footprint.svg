<svg class="fig-svg" viewBox="0 0 760 169" width="100%" role="img" aria-labelledby="fig-title-36483ca9" aria-describedby="fig-desc-36483ca9" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-36483ca9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-36483ca9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="169" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-36483ca9">The score matrix is 390 times the keys and values it summarizes</title><desc id="fig-desc-36483ca9">At L = 100,000 and d_head = 128, storing one head&#x27;s score matrix takes L^2 x 2 bytes = 20 GB, while its keys and values take 4Ld bytes = 51.2 MB. The ratio is L / 2d = 390x, and in FP32 the matrix would be 40 GB. FlashAttention stores none of it and recomputes the tiles in the backward pass for 2.56e12 extra FLOPs.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">The 20 GB bar is L^2 x 2 bytes; 51.2 MB is 4Ld. At 262,144 positions the keys and values for one head</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">are 262,144 × 128 × 2 × 2 = 134.2 MB, while a stored score matrix would be 262,144 × 262,144 × 2 =</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">137.4 GB, nearly seven times the 20 GB at L = 100,000.</text><text x="16.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">score matrix, one head</text><rect x="188.00" y="93.72" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1"/><text x="560.00" y="108.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">20 GB, L^2 x 2 bytes</text><text x="16.00" y="133.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">keys and values, one</text><text x="16.00" y="149.16" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start">head</text><rect x="188.00" y="127.72" width="2.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><text x="196.00" y="142.28" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">51.2 MB, 4Ld bytes</text></svg>