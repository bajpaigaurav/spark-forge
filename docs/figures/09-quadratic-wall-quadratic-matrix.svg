<svg class="fig-svg" viewBox="0 0 760 594" width="100%" role="img" aria-labelledby="fig-title-5d1db301" aria-describedby="fig-desc-5d1db301" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-5d1db301" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-5d1db301" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="594" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-5d1db301">The n × n score matrix is the quadratic term</title><desc id="fig-desc-5d1db301">Every query scores every key, so the score matrix is n × n; the causal mask keeps the lower triangle. At n = 130,659, n² = 1.707 × 10^10 entries. Stored as dense fp16 at 2 bytes each, one head in one layer is 34.1 GB, roughly 30.6% of the engine&#x27;s 111.5 GB, and the product over heads and layers passes the budget many times over. The grid is a schematic 10 × 10; the numbers are the chapter&#x27;s.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="memory">Schematic 10 × 10 causal grid, not to scale. At n = 130,659 the matrix has n² = 1.707 × 10^10</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="memory">entries; the causal triangle has n(n+1)/2. In fp16 at 2 bytes per entry, one head in one layer is</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="memory">34.1 GB, about 30.6% of the engine&#x27;s 111.5 GB; all heads and layers pass the budget many times over.</text><rect x="70.00" y="90.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="scores"/><rect x="116.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="162.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="208.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="254.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="300.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="346.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="392.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="438.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="484.00" y="90.72" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="70.00" y="136.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="scores"/><rect x="116.00" y="136.72" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="scores"/><rect x="162.00" y="136.72" width="46.00" height="46.00"