<svg class="fig-svg" viewBox="0 0 760 612" width="100%" role="img" aria-labelledby="fig-title-19addc54" aria-describedby="fig-desc-19addc54" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-19addc54" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-19addc54" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="612" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-19addc54">The n × n score matrix is the quadratic term</title><desc id="fig-desc-19addc54">Every query scores every key, so the score matrix is n × n; the causal mask keeps the lower triangle. At n = 131,072, n² = 1.718 × 10^10 entries. The chapter rounds that to 10^10 entries, so at 2 bytes each one head in one layer is 20 GB, about 10.4 percent of the 192 GB of HBM on an H100, and the product over heads and layers passes the budget many times over. The grid is a schematic 10 × 10; the numbers are the chapter&#x27;s.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Schematic 10 × 10 causal grid, not to scale: the lower triangle holds 1 + 2 + … + 10 = 55 of the 100</text><text x="16.00" y="30.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">cells. At n = 131,072 the matrix has n² = 1.718 × 10^10 entries; the causal triangle has n(n+1)/2.</text><text x="16.00" y="46.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Rounding to 10^10 entries at 2 bytes per fp16 entry, one head in one layer is 20 GB, about 10.4</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">percent of the 192 GB of HBM on an H100; all heads and layers pass that budget many times over.</text><rect x="70.00" y="108.96" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324)" stroke-width="0.9" data-part="rows-0-1"/><rect x="116.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="162.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="208.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="254.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="300.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="346.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="392.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="438.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="484.00" y="108.96" width="46.00" height="46.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.9" data-part="mask"/><rect x="70.00" y="154.96" width="46.00" height="46.00" rx="0" fill="rgba(138, 51, 36, 0.10)" stroke="var(--color-accent, #8a3324