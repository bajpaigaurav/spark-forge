<svg class="fig-svg" viewBox="0 0 760 201" width="100%" role="img" aria-labelledby="fig-title-49e199b8" aria-describedby="fig-desc-49e199b8" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-49e199b8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-49e199b8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="760" height="201" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-49e199b8">The cache bill for one token at four sharing schemes</title><desc id="fig-desc-49e199b8">For 32 layers of 32 heads with d_head = 128 in FP16, the cache costs 512 KiB per token under MHA, 128 KiB under GQA with 8 groups, and 16 KiB under MQA: a 32x spread. MLA caches a 512-element latent plus a 64-element rotary key, 36 KiB per token, about 14.2x smaller than MHA.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">2 x 32 layers x g x 128 x 2 bytes. MQA reads 512 bytes per token per layer where MHA reads 16,384.</text><text x="16.00" y="71.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mha">MHA, g = 32</text><rect x="188.00" y="57.24" width="366.00" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-mha"/><text x="560.00" y="62.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mha">512 KiB/token, 2 GiB at</text><text x="560.00" y="77.68" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mha">4,096</text><text x="16.00" y="105.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-gqa">GQA, g = 8</text><rect x="188.00" y="91.24" width="91.50" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-gqa"/><text x="285.50" y="105.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-gqa">128 KiB/token, 512 MiB at 4,096</text><text x="16.00" y="139.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mqa">MQA, g = 1</text><rect x="188.00" y="125.24" width="11.44" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.20)" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="b-mqa"/><text x="205.44" y="139.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mqa">16 KiB/token, 64 MiB at 4,096</text><text x="16.00" y="173.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="13.072" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mla">MLA latent</text><rect x="188.00" y="159.24" width="25.73" height="20.00" rx="0" fill="rgba(138, 51, 36, 0.34)" stroke="var(--color-accent, #8a3324)" stroke-width="1" data-part="b-mla"/><text x="219.73" y="173.80" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="12.767999999999999" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start" data-part="b-mla">36 KiB/token, 144 MiB at 4,096</text></svg>