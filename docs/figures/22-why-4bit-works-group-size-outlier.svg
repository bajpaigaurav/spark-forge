<svg class="fig-svg" viewBox="0 0 900 402" width="100%" role="img" aria-labelledby="fig-title-02cfd188" aria-describedby="fig-desc-02cfd188" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-02cfd188" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-02cfd188" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="402" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-02cfd188">Group size and bit width set the rounding floor</title><desc id="fig-desc-02cfd188">A symmetric four-bit group with m = 4.0 has step 2·4/15 ≈ 0.533, so 0.1, 0.2, and 0.3 all round to 0.2667. Put 4.0 in its own group and the remaining weights get m = 0.3 and step 0.04, so 0.1, 0.2, and 0.3 land on distinct levels. The floor is set by the bit width: at four bits the step is m/7 and the half-step ≈ 0.2σ; at three bits the step is m/3 and the half-step ≈ 0.43σ; at two bits the step is m and the half-step ≈ 1σ. Smaller groups isolate outliers, at the cost of more scale metadata.</desc><text x="16.00" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="one-scale">one scale for the group</text><line x1="16.00" y1="51.20" x2="286.67" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="one-scale"/><rect x="16.00" y="61.20" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-weights"/><text x="151.33" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="g-weights">weights: 0.1, 0.2, 0.3, 4.0</text><rect x="16.00" y="100.80" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-max"/><text x="151.33" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="g-max">m = 4.0</text><rect x="16.00" y="140.40" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-step"/><text x="151.33" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="g-step">step = 2·4/15 ≈ 0.533</text><rect x="16.00" y="180.00" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="g-collapse"/><text x="151.33" y="197.45" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="g-collapse">0.1, 0.2, 0.3 → 0.2667</text><text x="16.00" y="237.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="one-scale">The outlier sets the grid; the</text><text x="16.00" y="255.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="one-scale">three ordinary weights collapse</text><text x="16.00" y="273.60" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="one-scale">to one level.</text><text x="314.67" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="split">outlier in its own group</text><line x1="314.67" y1="51.20" x2="585.33" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="split"/><rect x="314.67" y="61.20" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="s-alone"/><text x="450.00" y="78.65" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="s-alone">4.0 alone</text><rect x="314.67" y="100.80" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="s-max"/><text x="450.00" y="118.25" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="s-max">remaining m = 0.3</text><rect x="314.67" y="140.40" width="270.67" height="31.60" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="s-step"/><text x="450.00" y="157.85" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="s-step">step = 0.04</text><rect x="314.67" y="180.00" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="s-levels"/><text x="450.00" y="198.75" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="s-levels">0.1, 0.2, 0.3 → distinct</text><text x="450.00" y="217.75" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="s-levels">levels</text><text x="314.67" y="259.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="split">The other three weights keep a</text><text x="314.67" y="277.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="split">scale set by their own range.</text><text x="613.33" y="26.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="16.2" font-weight="600" fill="var(--color-accent, #8a3324)" text-anchor="start" data-part="floor">bit width sets the floor</text><line x1="613.33" y1="51.20" x2="884.00" y2="51.20" stroke="var(--color-ink, #1a1d24)" stroke-width="1" data-part="floor"/><rect x="613.33" y="61.20" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="f-4bit"/><text x="748.67" y="79.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-4bit">4 bits: step m/7</text><text x="748.67" y="98.95" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-4bit">half-step ≈ 0.2σ</text><rect x="613.33" y="122.40" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="f-3bit"/><text x="748.67" y="141.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-3bit">3 bits: step m/3</text><text x="748.67" y="160.15" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-3bit">half-step ≈ 0.43σ</text><rect x="613.33" y="183.60" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="f-2bit"/><text x="748.67" y="202.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-2bit">2 bits: step m</text><text x="748.67" y="221.35" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-2bit">half-step ≈ 1σ</text><rect x="613.33" y="244.80" width="270.67" height="53.20" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="1" data-part="f-limit"/><text x="748.67" y="263.55" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-limit">at half-step ≈ σ, rounding is</text><text x="748.67" y="282.55" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle" data-part="f-limit">a different function</text><text x="613.33" y="324.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="floor">Four bits is an empirical</text><text x="613.33" y="342.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="floor">default, not a theorem; quality</text><text x="613.33" y="360.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start" data-part="floor">depends on group size and model.</text></svg>