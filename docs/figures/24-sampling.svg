<svg class="fig-svg" viewBox="0 0 900 318" width="100%" role="img" aria-labelledby="fig-title-aff6edf0" aria-describedby="fig-desc-aff6edf0" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-aff6edf0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-aff6edf0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="318" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-aff6edf0">Temperature moves the mass, never the order</title><desc id="fig-desc-aff6edf0">It shows the chapter worked example as a table of shares: the same three logits at T=1, T=0.5 and T=2, with top-k k=2 renormalising the first two. The order never changes; the tail mass does.</desc><text x="16.00" y="14.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">At T=0.5 the tail nearly vanishes; at T=2 it rises. Top-k k=2 drops the third token and renormalises</text><text x="16.00" y="33.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">0.844 + 0.114 = 0.958 into 0.881 and 0.119.</text><rect x="94.00" y="89.20" width="72.00" height="52.00" rx="0" fill="none" stroke="var(--color-rule, #b8bcc4)" stroke-width="0.8"/><rect x="99.00" y="100.75" width="62.00" height="35.45" rx="0" fill="var(--color-accent, #8a3324)" stroke="none" stroke-width="1.2"/><text x="130.00" y="101.20" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="middle">0.844</text><rect x="166.00" y="89.20" width="72.00" height="52.00" rx