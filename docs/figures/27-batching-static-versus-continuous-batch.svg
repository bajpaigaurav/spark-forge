<svg class="fig-svg" viewBox="0 0 900 608" width="100%" role="img" aria-labelledby="fig-title-90bda4b5" aria-describedby="fig-desc-90bda4b5" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-90bda4b5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-90bda4b5" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="608" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-90bda4b5">Static rows hold dead weight; continuous rows refill</title><desc id="fig-desc-90bda4b5">Static batching runs until the slowest sequence finishes. A request that stops after 200 tokens leaves its neighbours&#x27; finished rows in the batch, still read on every step, emitting nothing, so the batch runs at the speed of its slowest member. Continuous batching rebuilds the batch at every decode step: finished sequences retire, their slots refill, and the batch dimension changes. The figure uses six decode steps, one long request and two short neighbours; the step count is illustrative.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Padding wastes prefill too: a batch whose longest prompt is 100,000 tokens forces every shorter</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">prompt out to that length, and the layers chew through the padding as text. Continuous batching keeps</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the linear projections batched but segments attention per sequence with a block-diagonal mask, so</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">finished sequences cost nothing. A decode step at batch one reads one cache; at batch four it reads</text><text x="16.00" y="100.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">four caches plus the same weight read.</text><text x="183.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-1">step 1</text><text x="311.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-2">step 2</text><text x="438.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-3">step 3</text><text x="565.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-4">step 4</text><text x="693.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-5">step 5</text><text x="820.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle" data-part="step-6">step 6</text><text x="16.00" 