<svg class="fig-svg" viewBox="0 0 900 608" width="100%" role="img" aria-labelledby="fig-title-d36a8155" aria-describedby="fig-desc-d36a8155" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-d36a8155" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-muted, #5a6070)"/></marker><marker id="arrow-accent-d36a8155" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--color-accent, #8a3324)"/></marker></defs><rect x="0" y="0" width="900" height="608" fill="var(--color-sheet, #f2f1ed)"/><title id="fig-title-d36a8155">Static rows hold dead weight; continuous rows refill</title><desc id="fig-desc-d36a8155">Static batching runs until the slowest sequence finishes. A request that stops after 607 tokens leaves its neighbours&#x27; finished rows in the batch, still read on every step, emitting nothing, so the batch runs at the speed of its slowest member. Continuous batching rebuilds the batch at every decode step: finished sequences retire, their slots refill, and the batch dimension changes. The figure uses six decode steps, one long request of 607 tokens and two short neighbours; the step count is illustrative, the 607-token request is the chapter&#x27;s mean generation.</desc><text x="16.00" y="24.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">Padding wastes prefill too: a batch whose longest prompt is 130,659 tokens forces every shorter</text><text x="16.00" y="43.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">prompt out to that length, and the layers chew through the padding as text. Continuous batching keeps</text><text x="16.00" y="62.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">the linear projections batched but segments attention per sequence with a block-diagonal mask, so</text><text x="16.00" y="81.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">finished sequences cost nothing. At concurrency 1 a step takes 16.9 ms; at concurrency 4 it takes</text><text x="16.00" y="100.00" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="start">37.7 ms and emits four tokens.</text><text x="183.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 1</text><text x="311.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 2</text><text x="438.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 3</text><text x="565.67" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 4</text><text x="693.00" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 5</text><text x="820.33" y="162.27" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.4" font-weight="400" fill="var(--color-muted, #5a6070)" text-anchor="middle">step 6</text><text x="16.00" y="193.69" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15.48" font-weight="600" fill="var(--color-ink, #1a1d24)" text-anchor="start">static R1</text><line x1="16.00" y1="218.57" x2="884.00" y2="218.57" stroke="var(--color-rule, #b8bcc4)" stroke-width="1"/><rect x="121.00" y="164.00" width="125.33" height="48.57" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="183.67" y="189.91" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode</text><rect x="248.33" y="164.00" width="125.33" height="48.57" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="311.00" y="189.91" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode</text><rect x="375.67" y="164.00" width="125.33" height="48.57" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="438.33" y="189.91" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode</text><rect x="503.00" y="164.00" width="125.33" height="48.57" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="565.67" y="189.91" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode</text><rect x="630.33" y="164.00" width="125.33" height="48.57" rx="0" fill="none" stroke="var(--color-accent, #8a3324)" stroke-width="1.1"/><text x="693.00" y="189.91" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="14.76" font-weight="400" fill="var(--color-ink, #1a1d24)" text-anchor="middle">decode</text><rect x="757.67" y="164.00" width="125.33" height="48.57" rx="0" fill="none" strok